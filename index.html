<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#3b82c4">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>P-exam · ติวสอบตำรวจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="vendor/lucide.min.js"></script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand" id="brandProfileBtn" title="แตะเพื่อจัดการโปรไฟล์">
      <div class="logo-wrap" id="sideAvatarBox">
        <i data-lucide="shield-check"></i>
      </div>
      <div>
        <b id="sideUserName">P-exam</b>
        <span><i data-lucide="sparkles"></i> ติวสอบตำรวจ</span>
      </div>
    </div>
    <button class="nav on" data-go="home"><i data-lucide="layout-dashboard"></i>หน้าแรก</button>
    <button class="nav" data-go="quiz"><i data-lucide="file-text"></i>ข้อสอบ<span class="pill" id="pillQ">0</span></button>
    <button class="nav" data-go="cards"><i data-lucide="languages"></i>ภาษาอังกฤษ<span class="pill" id="pillC">0</span></button>
    <button class="nav" data-go="exam"><i data-lucide="timer"></i>จำลองสอบ</button>
    <button class="nav" data-go="result"><i data-lucide="bar-chart-3"></i>ผลลัพธ์</button>
    <button class="nav" data-go="setting"><i data-lucide="settings"></i>ตั้งค่า</button>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="title-block" id="topTitleBlock">
        <h1 id="ttl">หน้าแรก</h1>
        <div class="sub" id="sub">ติวสอบตำรวจ</div>
      </div>
      <div class="tools">
        <button class="ib" id="btnSearch" title="ค้นหา"><i data-lucide="search"></i></button>
        <button class="ib" id="btnTheme" title="ธีม"><i data-lucide="moon"></i></button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<nav class="bottomnav">
  <button class="bn on" data-go="home"><i data-lucide="home"></i>หน้าแรก</button>
  <button class="bn" data-go="quiz"><i data-lucide="file-text"></i>ข้อสอบ</button>
  <button class="bn" data-go="cards"><i data-lucide="languages"></i>อังกฤษ</button>
  <button class="bn" data-go="exam"><i data-lucide="timer"></i>สอบ</button>
  <button class="bn" data-go="result"><i data-lucide="bar-chart-3"></i>ผล</button>
  <button class="bn" data-go="setting"><i data-lucide="settings"></i>ตั้งค่า</button>
</nav>

<button class="fab" id="fab" hidden></button>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>

<div class="lightbox-mask" id="lightbox">
  <div class="lb-counter" id="lbCounter">1 / 1</div>
  <div class="lightbox-close" id="lightboxClose"><i data-lucide="x"></i></div>
  <button class="lb-btn lb-prev" id="lbPrev" title="รูปก่อนหน้า"><i data-lucide="chevron-left"></i></button>
  <div class="lightbox-container" id="lbTouchArea">
    <img class="lightbox-img" id="lightboxImg" src="" alt="Full Preview">
  </div>
  <button class="lb-btn lb-next" id="lbNext" title="รูปถัดไป"><i data-lucide="chevron-right"></i></button>
</div>

<div class="img-editor-mask" id="imgEditorMask">
  <div class="img-editor-modal">
    <div class="mh" style="justify-content:space-between">
      <div class="row" style="gap:8px">
        <i data-lucide="crop" style="width:18px;height:18px;color:var(--orange)"></i>
        <b>ปรับรูป</b>
      </div>
      <div class="row" style="gap:6px">
        <button class="ib sm" id="edRotL" title="หมุนซ้าย"><i data-lucide="rotate-ccw"></i></button>
        <button class="ib sm" id="edRotR" title="หมุนขวา"><i data-lucide="rotate-cw"></i></button>
        <button class="ib sm" id="edFlipH" title="กลับซ้ายขวา"><i data-lucide="flip-horizontal"></i></button>
        <button class="ib sm" id="edFlipV" title="กลับบนล่าง"><i data-lucide="flip-vertical"></i></button>
        <button class="ib sm" id="edReset" title="รีเซ็ต"><i data-lucide="refresh-cw"></i></button>
      </div>
    </div>
    <div class="img-editor-canvas-wrap">
      <canvas id="imgEditorCanvas"></canvas>
    </div>
    <div class="mf">
      <button class="btn ghost" id="edCancel">ยกเลิก</button>
      <button class="btn blue" id="edSave"><i data-lucide="check"></i>บันทึก</button>
    </div>
  </div>
</div>

<div class="rte-mask" id="rteMask">
  <div class="rte-modal">
    <div class="mh" style="justify-content:space-between">
      <div class="row" style="gap:8px">
        <i data-lucide="type" style="width:18px;height:18px;color:var(--blue)"></i>
        <b>จัดฟอนต์ข้อความ</b>
      </div>
      <button class="ib sm" id="rteClose" title="ปิด"><i data-lucide="x"></i></button>
    </div>
    <div class="rte-toolbar">
      <button type="button" class="rte-btn" data-cmd="bold" title="ตัวหนา"><i data-lucide="bold"></i></button>
      <button type="button" class="rte-btn" data-cmd="italic" title="ตัวเอียง"><i data-lucide="italic"></i></button>
      <button type="button" class="rte-btn" data-cmd="underline" title="ขีดเส้นใต้"><i data-lucide="underline"></i></button>
      <button type="button" class="rte-btn" data-cmd="strikeThrough" title="ขีดฆ่า"><i data-lucide="strikethrough"></i></button>
      <button type="button" class="rte-btn" onclick="insertFracModal()" title="เศษส่วน" style="font-weight:700;font-size:14px;">½</button>
      <button type="button" class="rte-btn" data-cmd="superscript" title="เลขยกกำลัง" style="font-weight:700;font-size:13px;">x²</button>
      <div class="rte-sep"></div>
      <button type="button" class="rte-btn" data-cmd="fontSize" data-val="5" title="ขยายใหญ่"><i data-lucide="zoom-in"></i></button>
      <button type="button" class="rte-btn" data-cmd="fontSize" data-val="3" title="ขนาดปกติ"><i data-lucide="type"></i></button>
      <button type="button" class="rte-btn" data-cmd="fontSize" data-val="1" title="ย่อเล็ก"><i data-lucide="zoom-out"></i></button>
      <div class="rte-sep"></div>
      <button type="button" class="rte-btn" id="btnToggleColor" title="เปลี่ยนสี"><i data-lucide="palette"></i></button>      
      <button type="button" class="rte-btn" data-cmd="removeFormat" title="ล้างฟอร์แมต"><i data-lucide="rotate-ccw"></i></button>
    </div>
    
    <div class="rte-color-palette" id="rteColorPalette">
      <span style="font-size:12px;color:var(--muted);margin-right:2px">สี:</span>
      <div class="rte-dot" data-col="#e5484d" style="background:#e5484d" title="แดง"></div>
      <div class="rte-dot" data-col="#f76b15" style="background:#f76b15" title="ส้ม"></div>
      <div class="rte-dot" data-col="#c99a06" style="background:#c99a06" title="ทอง"></div>
      <div class="rte-dot" data-col="#5d9b1c" style="background:#5d9b1c" title="เขียวมะนาว"></div>
      <div class="rte-dot" data-col="#2f9e64" style="background:#2f9e64" title="เขียว"></div>
      <div class="rte-dot" data-col="#0e9f9a" style="background:#0e9f9a" title="เขียวน้ำทะเล"></div>
      <div class="rte-dot" data-col="#0b8bd6" style="background:#0b8bd6" title="ฟ้า"></div>
      <div class="rte-dot" data-col="#3e63dd" style="background:#3e63dd" title="น้ำเงิน"></div>
      <div class="rte-dot" data-col="#8e4ec6" style="background:#8e4ec6" title="ม่วง"></div>
      <div class="rte-dot" data-col="#d6409f" style="background:#d6409f" title="ชมพู"></div>
      <div class="rte-dot" data-col="#9a6235" style="background:#9a6235" title="น้ำตาล"></div>
      <div class="rte-dot" data-col="#5f6673" style="background:#5f6673" title="เทา"></div>
      <div class="rte-dot" data-col="var(--text)" style="background:var(--text);border-color:var(--line)" title="สีข้อความหลัก"></div>
    </div>

    <div class="rte-area" id="rteContent" contenteditable="true" placeholder="พิมพ์ข้อความ หรือลากคลุมคำเพื่อจัดรูปแบบ..."></div>
    <div class="mf">
      <button class="btn ghost" id="rteCancel">ยกเลิก</button>
      <button class="btn blue" id="rteSave"><i data-lucide="check"></i>นำไปใช้</button>
    </div>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/media.js"></script>
<script src="js/ui.js"></script>
<script src="js/books.js"></script>
<script src="js/home.js"></script>
<script src="js/quiz.js"></script>
<script src="js/lessons.js"></script>
<script src="js/dict-words.js"></script>
<script src="js/dict-phrases.js"></script>
<script src="js/dict-idioms.js"></script>
<script src="js/english.js"></script>
<script src="js/engmap.js"></script>
<script src="js/cards.js"></script>
<script src="js/exam.js"></script>
<script src="js/settings.js"></script>
<script src="js/system.js"></script>
<script src="js/fx.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
