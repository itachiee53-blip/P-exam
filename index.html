<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Police Prep NEO · ติวสอบตำรวจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
:root{
  --bg:#f2f5fa; --surface:#fff; --surface2:#f6f8fc; --surface3:#eef2f9;
  --text:#0e1b31; --text2:#41527a; --muted:#7286a6; --line:#e4eaf4;
  --navy:#0e2c58; --blue:#2b7cf0; --blue-2:#e9f1ff;
  --green:#12a150; --green-2:#e4f8ed;
  --orange:#f08c00; --orange-2:#fff2dd;
  --red:#e04347; --red-2:#fdeaeb;
  --violet:#7a5af8; --violet-2:#f0ecff;
  --cyan:#0097a7; --cyan-2:#e0f7fa;
  --primary:#0e2c58; --onp:#fff;
  --r:18px; --r2:14px; --r3:11px;
  --sh1:0 1px 3px rgba(14,44,88,.06);
  --sh2:0 6px 18px rgba(14,44,88,.08);
}

[data-theme="dark"]{
  --bg:#080e1a; --surface:#101a2c; --surface2:#152136; --surface3:#1c2b45;
  --text:#e9eff9; --text2:#b3c2da; --muted:#8397b8; --line:#20304a;
  --navy:#e9eff9; --blue:#5c9dff; --blue-2:#16263f;
  --green:#2fcb7c; --green-2:#0f2c1e;
  --orange:#fbb034; --orange-2:#2f2410;
  --red:#ff6b70; --red-2:#33171a;
  --violet:#9d8bff; --violet-2:#1e1a38;
  --cyan:#26c6da; --cyan-2:#09292d;
  --primary:#2b7cf0; --onp:#fff;
  --sh1:0 1px 3px rgba(0,0,0,.2); --sh2:0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html, body {
  width: 100%;
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
  touch-action: pan-x pan-y;
}

body {
  margin: 0; 
  font-family: 'Sarabun', system-ui, -apple-system, sans-serif; 
  font-size: 15px; 
  line-height: 1.55;
  background: var(--bg); 
  color: var(--text); 
  -webkit-font-smoothing: antialiased;
}

body.modal-locked, body.lightbox-open{overflow:hidden!important;touch-action:none!important;position:fixed;width:100%;height:100%}

h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.2px}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px}
[hidden]{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

.app{display:grid;grid-template-columns:265px 1fr;min-height:100vh;min-height:100dvh;width:100%}
.sidebar{
  position:sticky;top:0;height:100dvh;background:var(--surface);border-right:1px solid var(--line);
  padding:20px 14px;display:flex;flex-direction:column;gap:5px;z-index:20;overflow-y:auto;
}
.brand{
  display:flex;align-items:center;gap:12px;padding:8px 10px 18px;flex:none;cursor:pointer;
  border-radius:16px;border:1px solid transparent;
}
.brand:hover{background:var(--surface2);border-color:var(--line)}
.brand .logo-wrap{
  position:relative;width:44px;height:44px;border-radius:14px;flex:none;overflow:hidden;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,#0e2c58,#2b7cf0);
}
[data-theme="dark"] .brand .logo-wrap{background:linear-gradient(140deg,#2b7cf0,#7a5af8)}
.brand .avatar-img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{display:block;font-size:16.5px;line-height:1.2;letter-spacing:-.3px;max-width:145px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand span{font-size:11.5px;color:var(--muted);letter-spacing:.2px;display:flex;align-items:center;gap:4px}
.brand span i{width:12px;height:12px}

.nav{
  display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border-radius:13px;
  color:var(--muted);font-weight:500;text-align:left;position:relative;flex:none
}
.nav svg{width:19px;height:19px;flex:none}
.nav:hover{background:var(--surface2);color:var(--text)}
.nav.on{background:var(--primary);color:var(--onp)}
.nav .pill{margin-left:auto;font-size:11px;font-weight:600;background:var(--surface3);color:var(--muted);padding:1px 8px;border-radius:20px}
.nav.on .pill{background:rgba(255,255,255,.22);color:#fff}

.main{
  width:100%;max-width:1180px;height:100dvh;
  padding:24px 30px calc(120px + env(safe-area-inset-bottom));
  min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;min-height:48px}
.topbar .title-block{flex:1;min-width:0}
.topbar h1{font-size:22px}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.tools{margin-left:auto;display:flex;gap:8px;flex:none}

.home-profile-header{
  display:none;align-items:center;gap:10px;padding:4px 8px;border-radius:14px;
  cursor:pointer;user-select:none;border:1px solid transparent;
  max-width:max-content;
}
.home-profile-header:hover{background:var(--surface2);border-color:var(--line)}
.hp-avatar-wrap{
  width:42px;height:42px;border-radius:13px;flex:none;overflow:hidden;
  display:grid;place-items:center;background:linear-gradient(140deg,#0e2c58,#2b7cf0);
  color:#fff;
}
.hp-avatar-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.hp-info{display:flex;flex-direction:column;min-width:0}
.hp-name-row{display:flex;align-items:center;gap:4px}
.hp-name-row b{font-size:17px;line-height:1.2;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp-name-row svg{width:15px;height:15px;color:var(--muted);flex:none}
.hp-track-badge{font-size:12px;color:var(--muted);line-height:1.2;margin-top:2px}

@media (max-width: 980px) and (orientation: portrait) {
  .home-profile-header { display: flex !important; }
}
@media (orientation: landscape) {
  .home-profile-header { display: none !important; }
}

.bottomnav{
  display:none;position:fixed;inset:auto 0 0 0;z-index:70;background:var(--surface);
  border-top:1px solid var(--line);padding:6px 2px calc(8px + env(safe-area-inset-bottom));
  justify-content:space-around;
}
.bn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);padding:6px 2px;border-radius:12px;flex:1;}
.bn svg{width:20px;height:20px}
.bn.on{color:var(--blue);background:var(--blue-2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);padding:18px;min-width:0}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.auto{grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}
.row{display:flex;align-items:center;gap:10px}
.sp{margin-left:auto}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 17px;border-radius:13px;
  font-weight:600;font-size:14.5px;background:var(--primary);color:var(--onp);white-space:nowrap
}
.btn svg{width:17px;height:17px}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.blue{background:var(--blue)} .btn.green{background:var(--green)} .btn.orange{background:var(--orange)}
.btn.red{background:var(--red)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.block{width:100%} .btn.lg{padding:15px 22px;font-size:15.5px;border-radius:16px}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px} .btn.sm svg{width:15px;height:15px}

.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted);flex:none}
.ib svg{width:18px;height:18px}
.ib:hover{color:var(--blue);border-color:var(--blue)}
.ib.sm{width:33px;height:33px;border-radius:10px} .ib.sm svg{width:15px;height:15px}
.ib.on{color:var(--orange);border-color:var(--orange);background:var(--orange-2)}
.ib.star.on{color:#f5a524;border-color:#f5a524;background:#fff6e0}
.ib.cut.on{color:var(--red);border-color:var(--red);background:var(--red-2)}

.chip{padding:7px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--primary);color:var(--onp);border-color:transparent;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.sc{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.sc::-webkit-scrollbar{display:none}

.tag{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--surface3);color:var(--muted);display:inline-flex;align-items:center;gap:4px;font-weight:500}
.tag.b{background:var(--blue-2);color:var(--blue)} .tag.g{background:var(--green-2);color:var(--green)}
.tag.o{background:var(--orange-2);color:var(--orange)} .tag.r{background:var(--red-2);color:var(--red)}

.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:5px}
.inp{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);outline:none}
.inp:focus{border-color:var(--blue);background:var(--surface)}
textarea.inp{resize:vertical;min-height:96px;line-height:1.6}

#modal .inp {font-size: 16px !important;padding: 13px 15px !important;}
#modal textarea.inp {min-height: 120px !important;line-height: 1.65 !important;}
#modal textarea#f_q {min-height: 140px !important;}
#modal textarea#f_e {min-height: 130px !important;}
#modal .field {margin-bottom: 18px !important;}

.c-select{
  display:inline-flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;
  border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);
  font-size:13.5px;font-weight:500;cursor:pointer;
}
.c-select:hover{border-color:var(--blue);background:var(--surface)}
.c-select svg{width:15px;height:15px;color:var(--muted)}

.picker-item{
  display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;
  border-radius:14px;font-size:15px;font-weight:500;color:var(--text);margin-bottom:6px;
  background:var(--surface2);border:1px solid var(--line);text-align:left
}
.picker-item:hover{background:var(--blue-2);color:var(--blue);border-color:var(--blue)}
.picker-item.on{background:var(--blue-2);color:var(--blue);border-color:var(--blue);font-weight:600}
.picker-item .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:transparent}
.picker-item.on .chk{border-color:var(--blue);background:var(--blue);color:#fff}

.banner-slider{position:relative;margin-bottom:14px;overflow:hidden;border-radius:18px}
.banner-track{display:flex;transition:transform .4s ease;width:100%}
.banner-slide{flex:0 0 100%;min-width:100%}
.banner-dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.b-dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.b-dot.on{width:18px;border-radius:4px;background:var(--blue)}

.coach-box{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh1);min-height:72px}
.coach-box .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.coach-box b{display:block;font-size:14.5px;line-height:1.3}
.coach-box small{font-size:12px;color:var(--muted);margin-top:2px;display:block}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px;box-shadow:var(--sh1)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:none;outline:none;padding:11px 0;color:var(--text)}

.bar {
  height: 8px;
  border-radius: 8px;
  background: var(--surface3);
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  border-radius: 8px;
  background: linear-gradient(90deg, #38bdf8, #2563eb, #7c3aed);
  background-size: 100vw 100%;
  transition: width 0.25s ease-out;
}

.sec{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin:24px 0 12px}
.sec svg{width:17px;height:17px;color:var(--muted)}
.sec .more{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--blue);cursor:pointer}
.empty{text-align:center;padding:42px 18px;color:var(--muted)}
.empty svg{width:34px;height:34px;opacity:.45;margin-bottom:8px}

.submit-check-icon {
  width: 80px;height: 80px;border-radius: 24px;background: var(--blue-2);color: var(--blue);
  display: grid;place-items: center;margin: 0 auto 12px;
}
.submit-check-icon svg {width: 42px;height: 42px;}

.week-card{
  background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;
  box-shadow:var(--sh1);display:flex;flex-direction:column;gap:14px;
}
.streak-row{display:flex;justify-content:space-between;align-items:center;gap:4px}
.streak-day-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;cursor:pointer;user-select:none;
}
.streak-circle{
  width:38px;height:38px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);
}
.streak-day-item.is-done .streak-circle{
  background:var(--blue-2);border-color:var(--blue);color:var(--blue);
}
.streak-day-item.is-today .streak-circle{
  background:var(--blue);border-color:var(--blue);color:#fff;
}
.streak-day-item.is-today.is-done .streak-circle{
  background:var(--green);border-color:var(--green);
}
.streak-day-item .day-lbl{font-size:12px;font-weight:600;color:var(--muted)}
.streak-day-item.is-today .day-lbl{color:var(--blue);font-weight:700}

.mastery-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;
  box-shadow:var(--sh1);display:flex;flex-direction:column;gap:18px;margin-top:14px;
}
.prob-gauge {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, #fb923c 0%, #ea580c 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 19px;
  color: #fff;
  border: 3px solid rgba(255, 255, 255, 0.85);
  flex: none;
}
.prob-gauge-wrap {
  display: flex;
  align-items: center;
  gap: 16px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 14px;
}
.prob-header {
  border-bottom: none !important;
  padding-bottom: 0 !important;
}

.prob-info b{font-size:16px;display:block;line-height:1.2}
.prob-info small{font-size:12px;color:var(--muted)}
.mastery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mastery-item{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;display:flex;flex-direction:column;gap:6px;}
.mastery-item:hover{border-color:var(--blue)}
.m-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600}
.m-bar{height:6px;border-radius:6px;background:var(--surface3);overflow:hidden}
.m-bar i{display:block;height:100%;border-radius:6px;transition:width .4s}

.qrow{
  content-visibility: auto;
  contain-intrinsic-size: 0 140px;
  display:flex;flex-direction:column;gap:8px;padding:15px 16px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);margin-bottom:11px;
  box-shadow:var(--sh1);
}

.qrow-top{display:flex;gap:12px;align-items:flex-start;width:100%}
.qrow .no{width:27px;height:27px;border-radius:9px;background:var(--surface3);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--muted);flex:none}
.qrow .body{flex:1;min-width:0}
.qrow .qt, .rq {white-space: pre-wrap !important;word-break: break-word !important;line-height: 1.65;}
.qrow .meta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.qrow .side{display:flex;gap:6px;flex:none}
.qrow .ansline{font-size:13.5px;color:var(--green);margin-top:6px;font-weight:600}

.q-media-box {width: 100%;margin: 10px 0 16px;display: flex;flex-direction: column;gap: 10px;align-items: center;}
.q-media-img {
  width: var(--img-w, 240px);max-width: 100%;max-height: 480px;border-radius: 14px;border: 1.5px solid var(--line);
  background: var(--surface2);cursor: pointer;object-fit: contain;display: block;margin: 0 auto;
}

.opts-vertical {display: flex;flex-direction: column;gap: 12px;}
.opts-horizontal {display: grid;grid-template-columns: repeat(2, 1fr);gap: 12px;}
@media(max-width:560px){.opts-horizontal { grid-template-columns: 1fr; }}
.opts-boxed {display: flex;flex-direction: column;gap: 14px;}
.opt-wrap {position: relative;width: 100%;display: flex;flex-direction: column;}
.opt-text {white-space: pre-wrap !important;word-break: break-word !important;line-height: 1.65;display: block;}

.opt-boxed-text {
  border: 1.5px solid var(--line);border-radius: 14px;padding: 14px 16px;background: var(--surface);
  line-height: 1.65;white-space: pre-wrap !important;word-break: break-word !important;display: block;font-family: inherit;font-size: 15px;box-shadow: 0 1px 3px rgba(0,0,0,.04);width: 100%;
}
.opt.on .opt-boxed-text {border-color: var(--blue);background: #fff;}
.opt.right .opt-boxed-text {border-color: var(--green);background: #fff;}
.opt.is-cut {opacity: 0.38 !important;filter: grayscale(1);text-decoration: line-through;pointer-events: none !important;background: var(--surface3) !important;border-color: transparent !important;}
.opt.is-cut * {text-decoration: line-through;}

.opt-exp-box {
  display: none !important;
  margin: 4px 0 0 0 !important;
  padding: 0px 10px !important;
  border-radius: 8px !important;
  font-size: 12.5px !important;
  line-height: 1.45 !important;
  background: var(--surface) !important;
  border: 1px solid var(--line) !important;
  width: 100% !important;
  box-sizing: border-box !important;
  white-space: pre-wrap !important;
  word-break: break-word !important;
}
.opt-exp-box.open { display: block !important; }
.opt-exp-box div { white-space: pre-wrap !important; word-break: break-word !important; }

.btn-why-round {
  position: absolute;top: 14px;right: 14px;width: 30px;height: 30px;border-radius: 50%;display: grid;place-items: center;
  background: rgba(14, 44, 88, 0.08);color: var(--muted);border: 1px solid rgba(14, 44, 88, 0.12);z-index: 5;
}
[data-theme="dark"] .btn-why-round {background: rgba(255, 255, 255, 0.08);border-color: rgba(255, 255, 255, 0.15);color: var(--muted);}
.btn-why-round.active {background: var(--blue);color: #fff;border-color: var(--blue);}
.btn-why-round svg {width: 16px;height: 16px;}

.hero{
  background:linear-gradient(135deg,#0e2c58,#17457f 55%,#2b7cf0);
  color:#fff;border-radius:22px;padding:24px;display:flex;gap:22px;align-items:center;
  box-shadow:var(--sh2);position:relative;overflow:hidden;
}
.hero[style*="url"] {
  background-size: cover !important;
}

.hero h2{font-size:22px} 
.hero p{opacity:.92;font-size:13px;margin-top:4px}
.hero .cta{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.hero .btn{background:rgba(255,255,255,.2);color:#fff}
.hero .btn.w{background:#fff;color:#0e2c58}

.ringbox{
  position: relative;
  width: 138px;
  height: 138px;
  flex: none;
  margin-left: auto;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  align-self: center;
}
.ringbox svg{
  width: 138px;
  height: 138px;
  transform: rotate(-90deg);
  display: block;
}
.ringbox circle{fill: none; stroke-linecap: round;}
.ringbox .bgc{
  stroke: rgba(255, 255, 255, 0.15);
  stroke-width: 10;
}
.ringbox .fgc{

/* Card & Stage Styling มินิมอลโมเดิร์น */
.fstage {
  max-width: 440px;
  margin: 0 auto;
}

.fcard {
  perspective: 1600px;
  height: 390px;
  margin: 16px 0 20px;
  cursor: pointer;
}

.fin {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.fcard.flip .fin {

}

.face {

  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 32px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;

  user-select: none;

.sring .txt b{font-size:48px;letter-spacing:-.06em;font-weight:700}
.mini{border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.mini b{font-size:22px;letter-spacing:-.03em}
.pass-badge{border-radius:999px}
.hrow{border-radius:14px}

/* ---------- flashcards ---------- */
.face{border-radius:28px!important}
html .front{
  background:var(--surface)!important;color:var(--text)!important;
  border:1px solid var(--line)!important;box-shadow:var(--sh2)!important;
}
html .front .tag{background:var(--text)!important;color:var(--bg)!important}
html .front .hint{color:var(--muted)!important}
html .card-word{color:var(--text);font-weight:700;letter-spacing:-.03em;font-size:28px}
html .btn-tts{background:var(--surface2);color:var(--text)}
html .back{
  background:#000000!important;color:#f5f5f6!important;border:1px solid rgba(255,255,255,.08)!important;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.8),inset 0 0 120px rgba(225,229,172,.08)!important;
}
html .back .tag{background:var(--acc)!important;color:var(--acc-ink)!important}
html .card-def{color:#f5f5f6}
.srs-btn{border-radius:16px;transition:transform .2s var(--spring)}
.srs-btn:hover{transform:translateY(-3px)}

/* ---------- modal / toast ---------- */
.mask{background:rgba(5,5,7,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mask.on .modal{animation:neoModal .45s var(--spring)}
@keyframes neoModal{from{opacity:0;transform:translateY(24px) scale(.96)}}
.modal,.rte-modal,.img-editor-modal{border-radius:26px;border:1px solid var(--line);box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.mh b{font-size:17px;letter-spacing:-.02em}
.toast{
  border-radius:999px;background:var(--text);color:var(--bg);font-weight:600;
  animation:neoToast .5s var(--spring);box-shadow:0 14px 30px -12px rgba(0,0,0,.5);
}
@keyframes neoToast{from{opacity:0;transform:translateY(-14px) scale(.9)}}

/* ---------- section titles ---------- */
.sec{font-size:16px;letter-spacing:-.02em;font-weight:700}
.sec .more{color:var(--text);text-decoration:underline;text-underline-offset:3px}

/* ---------- page enter (stagger) ---------- */
.neo-enter #view > *{animation:neoIn .55s var(--ease) both}
.neo-enter #view > *:nth-child(2){animation-delay:.05s}
.neo-enter #view > *:nth-child(3){animation-delay:.1s}
.neo-enter #view > *:nth-child(4){animation-delay:.15s}
.neo-enter #view > *:nth-child(5){animation-delay:.2s}
.neo-enter #view > *:nth-child(n+6){animation-delay:.25s}
.neo-enter .topbar{animation:neoIn .5s var(--ease) both}
@keyframes neoIn{from{opacity:0;transform:translateY(14px)}}

@media (max-width:980px) and (orientation:portrait){
  html .hero{min-height:0!important;padding:24px 22px!important;border-radius:26px!important}
  html .hero .ringbox{margin:22px auto 4px!important}
}
@media(max-width:720px){
  .topbar h1{font-size:26px}
  .hero h2{font-size:25px}
}
/* ---------- NEO HOME (การ์ดซ้อน + เมนูแคปซูล) ---------- */
:root{--cf:#6aa6da;--cf-deep:#3b82c4}
.neo-greet{font-size:32px;line-height:1.15;letter-spacing:-.04em;font-weight:700;margin:4px 0 16px}
.neo-greet span{color:var(--muted)}
.neo-chips{margin-bottom:34px}
.neo-chips .chip{padding:10px 16px;font-size:14px;background:var(--surface);color:var(--text)}
.neo-chips .chip i{font-style:normal;color:var(--muted);margin-left:2px}
.neo-chips .chip.on{background:var(--cf-deep);color:#fff}
.neo-chips .chip.on i{color:rgba(255,255,255,.75)}
.home-profile-header{padding:0}
.hp-avatar-wrap{width:52px;height:52px;border-radius:50%!important;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line)!important}
.hp-name-row b{font-size:16px}
.hp-track-badge{color:var(--cf-deep);font-weight:600}
@media(max-width:980px){.topbar .ib{width:52px;height:52px;border-radius:50%}}

.hero{
  background:linear-gradient(160deg,var(--cf) 0%,var(--cf-deep) 70%);border:0;border-radius:30px;
  box-shadow:0 26px 40px -26px rgba(59,130,196,.7);
}
[data-theme="dark"] .hero{background:linear-gradient(160deg,var(--cf) 0%,var(--cf-deep) 70%);box-shadow:none}
.hero::before,.hero::after{display:none}
.hero > div:first-child{padding-right:0}
.hero h2{margin-right:100px}
.hero p{display:inline-block;background:#fff;color:var(--cf-deep);opacity:1;font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px;margin:0 0 12px}
.hero h2{font-size:34px;line-height:1.12;color:#fff}
.hero .cta{flex-wrap:nowrap;align-items:center;margin-top:22px;gap:10px}
.hero .btn.w{
  flex:1;justify-content:flex-start;gap:12px;height:56px;padding:6px 18px 6px 6px;border-radius:999px;
  background:rgba(255,255,255,.22);color:#fff;box-shadow:none;border:0;
}
.hero .btn.w svg{flex:none;width:44px;height:44px;padding:13px;border-radius:50%;background:#fff;color:var(--cf-deep);fill:none}
.hero .btn.w::after{content:"›››";position:static;width:auto;height:auto;background:none;transform:none;margin-left:auto;letter-spacing:2px;opacity:.6;font-size:18px}
.hero .cta .btn:not(.w){font-size:0;gap:0;width:56px;height:56px;padding:0;border-radius:50%;background:#fff;color:#000;border:0;flex:none}
.hero .cta .btn:not(.w) svg{width:20px;height:20px}
.hero .cta .btn:not(.w)::after{display:none}
html .hero .ringbox{position:absolute!important;top:20px;right:20px;margin:0!important;width:86px!important;height:86px!important}
.hero .ringbox svg{width:86px;height:86px}
.ringbox::before{display:none}
.ringbox .bgc{stroke:rgba(255,255,255,.25)}
.ringbox .fgc{stroke:#fff!important}
.ringbox .txt b{font-size:19px}
.ringbox .txt span{font-size:9.5px;color:rgba(255,255,255,.85)}
@media (max-width:980px) and (orientation:portrait){html .hero{min-height:0!important;padding:22px!important;border-radius:30px!important}}
/* กองการ์ดปัดได้ */
.neo-deck{display:grid;margin-top:8px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.neo-deck > .neo-dcard{grid-area:1/1;transform-origin:50% 0;transition:transform .45s var(--ease),opacity .45s;margin:0}
.neo-dcard[data-pos="0"]{z-index:3}
.neo-dcard[data-pos="1"]{z-index:2;transform:translateY(-16px) scale(.94);opacity:.9;pointer-events:none}
.neo-dcard[data-pos="2"]{z-index:1;transform:translateY(-32px) scale(.88);opacity:.7;pointer-events:none}
.neo-dcard[data-pos]:not([data-pos="0"]):not([data-pos="1"]):not([data-pos="2"]){z-index:0;transform:translateY(-32px) scale(.88);opacity:0;pointer-events:none}
.neo-deck{grid-template-rows:100%}
/* ให้ทุกส่วนในกองการ์ดส่งการปัดแนวนอนมาที่สคริปต์ (การ์ดที่เลื่อนได้จะไม่แย่งการปัด) */
.neo-deck,.neo-deck *{touch-action:pan-y}
.neo-dcard:not([data-pos="0"]) > *{visibility:hidden}
.neo-dcard[data-pos="1"],.neo-dcard[data-pos="2"]{opacity:1}
/* เอาแถวชิปออก การ์ดจะยืดลงมาแทน */
.neo-chips{display:none}
.neo-greet{margin-bottom:34px}
body.neo-home .main{padding-bottom:0}
html .neo-deck .hero{flex-direction:column!important;align-items:stretch!important;justify-content:flex-start!important}
.neo-deck .hero > div:first-child{display:contents}
.neo-deck .hero p{order:1;align-self:flex-start}
.neo-deck .hero h2{order:2;margin-right:0;font-size:40px}
html .neo-deck .hero .ringbox{order:3;position:relative!important;top:auto;right:auto;margin:auto!important;height:min(200px,40%)!important;width:auto!important;aspect-ratio:1;flex:none}
.neo-deck .hero .ringbox svg{width:100%;height:100%}
.neo-deck .hero .ringbox .bgc{stroke-width:10}
.neo-deck .hero .ringbox .fgc{stroke-width:11}
.neo-deck .hero .ringbox .txt b{font-size:40px}
.neo-deck .hero .ringbox .txt span{font-size:13px}
.neo-deck .hero .cta{order:4;margin-top:0}
.neo-dcard{box-shadow:0 26px 40px -28px rgba(0,0,0,.45)}
.neo-extra{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:20px;overflow-y:auto;overscroll-behavior:contain}
.neo-extra > *{margin:0!important}
.neo-extra .mastery-card,.neo-extra .resume-card,.neo-extra .week-card{border:0;box-shadow:none;background:transparent;padding:0;margin:0}
.neo-extra .mastery-card::before,.neo-extra .resume-card::before,.neo-extra .week-card::before{display:none}
.neo-extra .banner-slider{overflow:visible}
.neo-extra .banner-track{flex-direction:column;gap:10px;transform:none!important}
.neo-extra .banner-slide{min-width:0}
.neo-extra .banner-dots{display:none}
.neo-stat-card,.neo-prob-card{border-radius:30px;padding:22px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.neo-stat-card{background:#000;color:#fbfbf8}
[data-theme="dark"] .neo-stat-card{background:#1a1f25}
.neo-prob-card{background:#e1e5ac;color:#000}
.neo-dc-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.neo-dc-head svg{width:22px;height:22px;opacity:.6}
.neo-pill{display:inline-block;background:#fff;color:#000;font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px}
.neo-pill.ghost{background:rgba(0,0,0,.08)}
.neo-time small{display:block;font-size:13px;opacity:.6}
.neo-time b{display:block;font-size:44px;line-height:1.05;letter-spacing:-.04em;color:#e1e5ac}
.neo-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.neo-mini-grid div{background:rgba(255,255,255,.08);border-radius:18px;padding:10px 12px}
.neo-mini-grid b{display:block;font-size:22px;letter-spacing:-.03em}
.neo-mini-grid span{font-size:11.5px;opacity:.6}
.neo-big{font-size:72px;font-weight:700;line-height:1;letter-spacing:-.06em}
.neo-big small{font-size:28px}
.neo-prob-card h3{font-size:22px;line-height:1.2}
.neo-prob-card p{font-size:13px;opacity:.6;margin-top:auto}
.neo-deck-dots{display:flex;justify-content:center;gap:6px;margin:12px 0 4px}
.neo-deck-dots i{width:7px;height:7px;border-radius:99px;background:var(--surface3);cursor:pointer;transition:all .35s var(--spring)}
.neo-deck-dots i.on{width:22px;background:var(--cf-deep)}

@media(max-width:980px){
  .bottomnav{left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);gap:6px;padding:7px;border-radius:999px;justify-content:center}
  .bn{flex:0 0 42px;height:42px;padding:0;font-size:0;gap:0;border-radius:50%;background:var(--surface2);justify-content:center}
  .bn.on{flex:0 0 auto;flex-direction:row;gap:6px;font-size:13px;padding:0 16px;border-radius:999px;background:var(--cf-deep);color:#fff;transform:none}
  .bn.on svg{color:#fff!important}
}

/* การ์ดสถิติสัปดาห์ในกอง */
.neo-week{display:flex;flex-direction:column;justify-content:space-between;gap:16px;cursor:pointer}
.neo-week-sum{display:flex;gap:14px;align-items:center;background:var(--surface2);border-radius:22px;padding:14px}
.neo-week-sum > div:first-child{flex:1;min-width:0}
.neo-week-sum small{display:block;font-size:12px;color:var(--muted)}
.neo-week-sum b{display:block;font-size:26px;letter-spacing:-.04em;line-height:1.15}
.neo-week-sum span{font-size:12px;color:var(--muted)}
.neo-week-heat{display:grid;grid-template-columns:repeat(7,12px);gap:4px}
.neo-week-heat i{width:12px;height:12px;border-radius:4px}
.neo-cal-btn{margin-top:auto;background:var(--cf-deep);color:#fff;height:52px;border-radius:999px}
/* สีความเข้ม (ใช้ร่วมกันทั้งปฏิทินและการ์ด) */
.h0{background:var(--surface3)} .hx{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.h1{background:#d6e6f5} .h2{background:#a3c7e9} .h3{background:#6aa6da;color:#fff} .h4{background:#3b82c4;color:#fff}
[data-theme="dark"] .h1{background:#163049} [data-theme="dark"] .h2{background:#1f4a73}
[data-theme="dark"] .h3{background:#3b82c4} [data-theme="dark"] .h4{background:#6aa6da;color:#000}
/* ปฏิทิน */
.neo-cal{position:fixed;inset:0;z-index:110;background:rgba(5,5,7,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.neo-cal.on{opacity:1;pointer-events:auto}
.neo-cal-sheet{width:100%;max-width:560px;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:32px 32px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(60px);transition:transform .45s var(--spring)}
.neo-cal.on .neo-cal-sheet{transform:none}
@media(min-width:600px){.neo-cal{align-items:center}.neo-cal-sheet{border-radius:32px}}
.neo-cal-grab{width:42px;height:5px;border-radius:9px;background:var(--surface3);margin:4px auto 12px}
.neo-cal-top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.neo-cal-top .ib{border-radius:50%}
.neo-cal-title{flex:1;display:flex;align-items:center;gap:6px;font-size:24px;font-weight:700;letter-spacing:-.03em;padding:4px 6px;text-align:left;min-width:0}
.neo-cal-title svg{width:18px;height:18px;color:var(--muted);flex:none}
.neo-cal-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.neo-cal-sum div{background:#000;color:#fbfbf8;border-radius:18px;padding:10px 6px;text-align:center;min-width:0}
.neo-cal-sum div:first-child{background:var(--cf-deep)}
[data-theme="dark"] .neo-cal-sum div:not(:first-child){background:var(--surface2)}
.neo-cal-sum b{display:block;font-size:17px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neo-cal-sum span{font-size:11px;opacity:.65}
.neo-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:12px;touch-action:pan-y}
.neo-cal-grid > i{font-style:normal;text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding-bottom:2px}
.neo-cd{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text);transition:transform .25s var(--spring),background .2s}
.neo-cd.h0{background:var(--surface2)}
.neo-cd b{font-size:14px;font-weight:600;line-height:1.1}
.neo-cd small{font-size:9.5px;opacity:.85;line-height:1}
.neo-cd.today{box-shadow:inset 0 0 0 2px var(--text)}
.neo-cd.sel{background:var(--primary);color:var(--onp);transform:scale(1.08);box-shadow:0 8px 18px -8px rgba(0,0,0,.5)}
.neo-cal-legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--muted);margin:10px 6px 14px}
.neo-cal-legend span{width:12px;height:12px;border-radius:4px}
.neo-cal-day{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:neoIn .35s var(--ease)}
.neo-cal-day.empty{text-align:center;color:var(--muted)}
.neo-cal-day-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.neo-cal-day-h b{display:block;font-size:16px;line-height:1.3}
.neo-cal-day-h small{color:var(--muted);font-size:12px}
.neo-cal-day-h .neo-pill{background:var(--acc);color:#000;flex:none}
.neo-cal-day-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.neo-cal-day-stats div{background:var(--surface2);border-radius:16px;padding:10px 6px;text-align:center}
.neo-cal-day-stats b{display:block;font-size:20px;letter-spacing:-.03em}
.neo-cal-day-stats span{font-size:11px;color:var(--muted)}
.neo-cal-cats{display:flex;flex-wrap:wrap;gap:6px}
.neo-cal-years{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;touch-action:pan-y}
.neo-cm{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .2s var(--spring)}
.neo-cm b{font-size:16px}
.neo-cm small{color:var(--muted);font-size:11.5px}
.neo-cm.today{box-shadow:0 0 0 2px var(--cf-deep)}
.neo-cm-bar{height:6px;border-radius:9px;background:var(--surface3);overflow:hidden}
.neo-cm-bar i{display:block;height:100%;background:var(--cf-deep);border-radius:9px}

/* แป้นพิมพ์มือถือ: ย่อ modal ให้อยู่เหนือแป้นพิมพ์ (ค่าจาก visualViewport) */
.mask,.rte-mask,.img-editor-mask{top:var(--neo-vvt,0px);bottom:auto;height:var(--neo-vvh,100%)}
.mask .modal{max-height:calc(var(--neo-vvh,100dvh) - 24px)}
.rte-mask .rte-modal{height:min(88dvh,calc(var(--neo-vvh,100dvh) - 24px))}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

function formatThaiDate(dateStr){
  if(!dateStr) return 'ยังไม่ได้กำหนด';
  const parts = dateStr.split('-');
  if(parts.length !== 3) return dateStr;
  const y = parseInt(parts[0], 10) + 543;
  const m = THAI_MONTHS[parseInt(parts[1], 10) - 1];
  const d = parseInt(parts[2], 10);
  return `${d} ${m} ${y}`;
}

const DB_NAME = 'PolicePrepDB';
const DB_VERSION = 1;
let db = null;

function initDB(){
  return new Promise((res, rej)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('app_state')){
        d.createObjectStore('app_state', { keyPath: 'key' });
      }
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = e => rej(e);
  });
}

function dbGet(key){
  return new Promise(res => {
    if(!db) return res(null);
    const tx = db.transaction('app_state', 'readonly');
    const store = tx.objectStore('app_state');
    const req = store.get(key);
    req.onsuccess = () => res(req.result ? req.result.val : null);
    req.onerror = () => res(null);
  });
}

function dbSet(key, val){
  return new Promise(res => {
    if(!db) return res(false);
    const tx = db.transaction('app_state', 'readwrite');
    const store = tx.objectStore('app_state');
    store.put({ key, val });
    tx.oncomplete = () => res(true);
    tx.onerror = () => res(false);
  });
}

function evaluateAdaptiveDifficulty(questionId, isCorrect){
  const q = S.questions.find(x => x.id === questionId);
  if(!q) return;

  const st = S.qstat[questionId] = S.qstat[questionId] || { seen: 0, ok: 0, bad: 0, streakOk: 0, streakBad: 0 };

  if(isCorrect){
    st.streakOk = (st.streakOk || 0) + 1;
    st.streakBad = 0;
    if(st.streakOk >= 2){
      if(q.d === 'ยาก') q.d = 'ปานกลาง';
      else if(q.d === 'ปานกลาง') q.d = 'ง่าย';
      st.streakOk = 0;
    }
  } else {
    st.streakBad = (st.streakBad || 0) + 1;
    st.streakOk = 0;
    if(st.streakBad >= 2){
      if(q.d === 'ง่าย') q.d = 'ปานกลาง';
      else if(q.d === 'ปานกลาง') q.d = 'ยาก';
      st.streakBad = 0;
    }
  }
}

function optimizeImage(file, maxWidth = 800, quality = 0.75){
  return new Promise((resolve) => {
    const img = new Image();
    // ใช้วิธีสร้าง URL ชั่วคราวแทนการอ่านไฟล์ลงแรม (ประหยัดแรมมือถือได้ 90% ป้องกันเว็บเด้ง)
    const objectUrl = URL.createObjectURL(file);
    
    img.onload = () => {
      // คืนพื้นที่แรมทันทีที่โหลดรูปเสร็จ
      URL.revokeObjectURL(objectUrl);
      
      let { width, height } = img;
      // ล็อกขนาดสูงสุดไว้ไม่ให้เกิน 800x1200 เพื่อไม่ให้ Editor กินแรมตอนปรับรูป
      const MAX_W = maxWidth;
      const MAX_H = 1200;
      
      if(width > MAX_W || height > MAX_H){
        const ratio = Math.min(MAX_W / width, MAX_H / height);
        width = Math.round(width * ratio);
        height = Math.round(height * ratio);
      }
      
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d', { alpha: false });
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(img, 0, 0, width, height);
      
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    
    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      resolve(null);
    };
    
    img.src = objectUrl;
  });
}

function openLightboxGallery(imgList, startIdx = 0){
  if(!imgList || !imgList.length) return;
  playTone('tap');
  activeGallery = imgList;
  activeGalleryIdx = clamp(startIdx, 0, imgList.length - 1);
  updateGalleryView();
  $('#lightbox').classList.add('on');
  document.body.classList.add('lightbox-open');
}

function updateGalleryView(){
  const img = $('#lightboxImg');
  const counter = $('#lbCounter');
  const prevBtn = $('#lbPrev');
  const nextBtn = $('#lbNext');

  img.src = activeGallery[activeGalleryIdx];
  counter.textContent = `${activeGalleryIdx + 1} / ${activeGallery.length}`;

  const isMulti = activeGallery.length > 1;
  prevBtn.style.display = isMulti ? 'grid' : 'none';
  nextBtn.style.display = isMulti ? 'grid' : 'none';
  icons($('#lightbox'));
}

function stepGallery(dir){
  if(activeGallery.length <= 1) return;
  playTone('tap');
  activeGalleryIdx = (activeGalleryIdx + dir + activeGallery.length) % activeGallery.length;
  updateGalleryView();
}

  playTone('tap');

  $('#lightboxImg').src = '';
  activeGallery = [];
  document.body.classList.remove('lightbox-open');
}

let lbTouchStartX = 0;
$('#lightbox').ontouchstart = e => {

  if(!$('#mask').classList.contains('on') && !$('#rteMask').classList.contains('on')) {
    document.body.classList.remove('modal-locked');
  }
  editorCallback = null;
}

function redrawEditorCanvas(){
  const canvas = $('#imgEditorCanvas');
  if(!canvas || !editorImage.width) return;
  const ctx = canvas.getContext('2d');
  
  const rad = (editorState.rotation * Math.PI) / 180;
  const isRotated = Math.abs(editorState.rotation % 180) !== 0;
  
  const w = isRotated ? editorImage.height : editorImage.width;
  const h = isRotated ? editorImage.width : editorImage.height;

  const maxW = 520, maxH = 320;
  const scale = Math.min(1, maxW / w, maxH / h);

  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(rad);
  ctx.scale(editorState.flipH ? -1 : 1, editorState.flipV ? -1 : 1);
  ctx.drawImage(
    editorImage,
    -editorImage.width * scale / 2,
    -editorImage.height * scale / 2,
    editorImage.width * scale,
    editorImage.height * scale
  );
  ctx.restore();
}

function exportEditedImage(){
  if(!editorImage.width) return '';
  const isRotated = Math.abs(editorState.rotation % 180) !== 0;
  const w = isRotated ? editorImage.height : editorImage.width;
  const h = isRotated ? editorImage.width : editorImage.height;

  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = true;

  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.rotate((editorState.rotation * Math.PI) / 180);
  ctx.scale(editorState.flipH ? -1 : 1, editorState.flipV ? -1 : 1);
  ctx.drawImage(editorImage, -editorImage.width / 2, -editorImage.height / 2);
  ctx.restore();

  return canvas.toDataURL('image/jpeg', 0.85);
}

$('#edRotL').onclick = () => { playTone('tap'); editorState.rotation = (editorState.rotation - 90) % 360; redrawEditorCanvas(); };
$('#edRotR').onclick = () => { playTone('tap'); editorState.rotation = (editorState.rotation + 90) % 360; redrawEditorCanvas(); };
$('#edFlipH').onclick = () => { playTone('tap'); editorState.flipH = !editorState.flipH; redrawEditorCanvas(); };
$('#edFlipV').onclick = () => { playTone('tap'); editorState.flipV = !editorState.flipV; redrawEditorCanvas(); };
$('#edReset').onclick = () => { playTone('tap'); editorState = { rotation: 0, flipH: false, flipV: false }; redrawEditorCanvas(); };
$('#edCancel').onclick = () => { playTone('tap'); closeImageEditor(); };
$('#edSave').onclick = () => {

  closeImageEditor();
};

let rteTarget = null;
let savedSelection = null;

function saveCurrentSelection(){
  const sel = window.getSelection();
  if(sel.rangeCount > 0){
    savedSelection = sel.getRangeAt(0);    
  }
}

function restoreCurrentSelection(){
  if(savedSelection){
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedSelection);
  }
}

function openRichTextEditor(targetInputId){
  playTone('tap');
  const target = document.getElementById(targetInputId);
  if(!target) return;
  rteTarget = target;
  
  const box = $('#rteContent');
  box.innerHTML = target.value ? target.value.replace(/\n/g, '<br>') : '';
  
  $('#rteColorPalette').classList.remove('open');
  $('#rteMask').classList.add('on');
  document.body.classList.add('modal-locked');
  icons($('#rteMask'));
  box.focus();
}

function closeRichTextEditor(){
  $('#rteMask').classList.remove('on');
  $('#rteColorPalette').classList.remove('open');
  if(!$('#mask').classList.contains('on')) document.body.classList.remove('modal-locked');
  rteTarget = null;
  savedSelection = null;
}

document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  const box = $('#rteContent');
  if (sel && sel.rangeCount > 0 && box && box.contains(sel.anchorNode)) {
    savedSelection = sel.getRangeAt(0);
  }
});

$$('#rteMask [data-cmd]').forEach(btn => {
  btn.onmousedown = (e) => {
    e.preventDefault();
    playTone('tap');
    const cmd = btn.dataset.cmd;
    const val = btn.dataset.val || null;
    document.execCommand(cmd, false, val);
    saveCurrentSelection();
  };
});

window.insertFracModal = function() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;

  const range = sel.getRangeAt(0);
  const selectedText = sel.toString().trim();

  let num = '1', den = '2';

  if (selectedText && selectedText.includes('/')) {
    const parts = selectedText.split('/');
    num = parts[0].trim();
    den = parts[1].trim();
  }

  const fracSpan = document.createElement('span');
  fracSpan.className = 'math-frac';
  fracSpan.innerHTML = `<span>${num}</span><span>${den}</span>`;

  range.deleteContents();
  range.insertNode(fracSpan);

  range.setStartAfter(fracSpan);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
};

const toggleColorBtn = $('#btnToggleColor');
if(toggleColorBtn) {
  toggleColorBtn.onpointerdown = (e) => {

$$('.rte-dot').forEach(dot => {

    e.stopPropagation();

const sfxTap = new Audio("pop.mp3");

const sfxWrong = new Audio("wrong.mp3");

function playTone(type='tap'){
  if(!S.settings.sound) return;
  try{
    let a = null;
    if(type === 'pick') a = sfxPick;
    else if(type === 'ok') a = sfxOk;
    else if(type === 'wrong') a = sfxWrong;
    else if(type === 'submit') a = sfxSubmit;
    else a = sfxTap;

    if(a){
      a.currentTime = 0;
      a.play().catch(()=>{});
    }
  }catch(e){}
}

function speakWord(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = 0.9;
  window.speechSynthesis.speak(utterance);
}

function toast(msg,type='info'){
  const el=document.createElement('div');
  el.className='toast '+type;
  const ic=type==='err'?'alert-circle':type==='ok'?'check-circle-2':'info';
  el.innerHTML=`<i data-lucide="${ic}"></i>${esc(msg)}`;
  $('#toasts').appendChild(el); icons(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),280);},1600);
}

function openModal(title,body,footer,opt={}){
  playTone('tap');
  const m = $('#modal');
  m.innerHTML=
    `<div class="mh"><b>${title}</b><button class="ib sm sp" data-close><i data-lucide="x"></i></button></div>
     <div class="mb">${body}</div>${footer?`<div class="mf">${footer}</div>`:''}`;
  $('#mask').classList.add('on');
  window._lastScrollY = window.scrollY;
  document.body.classList.add('modal-locked');
  icons(m);
  $$('[data-close]').forEach(b=>b.onclick=closeModal);
  if(opt.focus) setTimeout(()=>{const f=$(opt.focus);f&&f.focus();},60);
}

function closeModal(){
  playTone('tap');
  $('#mask').classList.remove('on');
  if(!$('#rteMask').classList.contains('on')){
    document.body.classList.remove('modal-locked');
    window.scrollTo(0, window._lastScrollY || 0);
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('#lightbox').classList.contains('on')) closeLightbox();
    else if($('#rteMask').classList.contains('on')) closeRichTextEditor();
    else if($('#imgEditorMask').classList.contains('on')) closeImageEditor();
    else closeModal();
  }
  if($('#lightbox').classList.contains('on')){
    if(e.key==='ArrowLeft') stepGallery(-1);
    if(e.key==='ArrowRight') stepGallery(1);
  }
});

        const v = isObj ? opt.val : opt;
        const lb = isObj ? opt.label : opt;
        const sel = String(v) === String(value);
        return `
          <button class="picker-item ${sel?'on':''}" data-val="${esc(v)}">
            <span>${esc(lb)}</span>
            <span class="chk"><i data-lucide="check" style="width:14px;height:14px"></i></span>

    btn.onclick = () => {

  const days = Array.from({length:31}, (_,i)=>i+1);
  const years = [curY-1, curY, curY+1, curY+2];

  const body = `
    <div style="display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;padding:8px 0">
      <div>

        <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px">ปี พ.ศ.</label>

          ${years.map(y=>`<option value="${y}" ${y===curY?'selected':''}>${y+543}</option>`).join('')}
        </select>
      </div>
    </div>
  `;

  openModal('วันสอบจริง', body, `

    openModal(title,`<p style="color:var(--text2);line-height:1.6">${esc(msg)}</p>`,
      `<button class="btn ghost" id="_no">ยกเลิก</button><button class="btn ${danger?'red':''}" id="_yes">${esc(okText)}</button>`);
    $('#_no').onclick=()=>{closeModal();res(false);};

}

function avg(){ 
  const totalQuestions = S.questions.length;
  if(!totalQuestions) return 0;
  let okCount = 0;
  for(const q of S.questions){
    const st = S.qstat[q.id];
    if(st && st.ok > 0) okCount++;
  }
  return Math.round((okCount / totalQuestions) * 100);
}

function streak(){
  let n=0,d=new Date();
  if(!(S.stats.days[dkey(d)]?.answered)) d.setDate(d.getDate()-1);
  for(;;){ const k=dkey(d); if(S.stats.days[k]?.answered>0){n++;d.setDate(d.getDate()-1);} else break; if(n>400)break; }
  return n;
}

function getMonToSunWeek(){
  const now = new Date();
  const currentDayOfWeek = now.getDay();
  const diffToMonday = (currentDayOfWeek === 0 ? -6 : 1) - currentDayOfWeek;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diffToMonday);

  const N = ['จ','อ','พ','พฤ','ศ','ส','อา'];
  const out = [];
  const todayKey = dkey(now);

  for(let i=0; i<7; i++){
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const k = dkey(d);
    out.push({
      k,
      dObj: d,
      lb: N[i],
      n: S.stats.days[k]?.answered || 0,
      today: k === todayKey
    });
  }
  return out;
}

function getCountdownInfo(){
  if(!S.settings.examDate) return null;
  const target = new Date(S.settings.examDate + 'T00:00:00');
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diffTime = target - today;
  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
  
  if(isNaN(diffDays)) return null;

  return {
    daysLeft: diffDays,
    isPassed: diffDays < 0,
    isToday: diffDays === 0,
    examDateStr: formatThaiDate(S.settings.examDate)
  };
}

function analyzeWeakness(trackKey = 'admin'){
  const track = POLICE_TRACKS[trackKey] || POLICE_TRACKS.admin;
  const stats = {};
  S.cats.forEach(c => stats[c] = { bad:0, total:0, seen:0 });

  for(const q of S.questions){
    const st = S.qstat[q.id];
    if(st && st.seen){
      stats[q.cat].seen += st.seen;
      stats[q.cat].bad += st.bad;
    }
  }

  let worstCat = null, maxBad = 0;
  for(const [c, d] of Object.entries(stats)){
    const isFocus = track.focusCats.includes(c);
    const weightedBad = d.bad * (isFocus ? 1.5 : 1.0);
    if(weightedBad > maxBad && d.bad > 0){
      maxBad = d.bad;
      worstCat = c;
    }
  }
  return { worstCat, maxBad };
}

function calculateReadinessAndMastery(trackKey = 'admin'){
  const track = POLICE_TRACKS[trackKey] || POLICE_TRACKS.admin;
  const mastery = {};
  
  S.cats.forEach(c => {
    mastery[c] = { 
      totalQ: 0,        // จำนวนข้อทั้งหมดในคลังวิชานี้
      seenQ: 0,         // จำนวนข้อไม่ซ้ำที่เคยทำไปแล้ว
      masteredQ: 0,     // ข้อที่ทำถูก (สถานะปัจจุบันทำได้)
      accuracy: 0,      // ความแม่นยำ % (ถูก / ข้อที่ทำแล้ว)
      coverage: 0,      // ความครอบคลุมเนื้อหา % (ทำแล้ว / คลังทั้งหมด)
      pct: 0,           // คะแนนความพร้อมรวม (70/30)
      confidence: 'low',// ระดับความน่าเชื่อถือข้อมูล
      statusText: ''    // ข้อความประเมิน
    };
  });

  // นับสถิติรายข้อตามจริงจากคลัง
  S.questions.forEach(q => {
    if(mastery[q.cat]){
      mastery[q.cat].totalQ++;
      const st = S.qstat[q.id];
      if(st && st.seen > 0){
        mastery[q.cat].seenQ++;
        // ถือว่าแม่นยำถ้าตอบถูกมากกว่าหรือเท่ากับตอบผิดในข้อนั้น
        if((st.ok || 0) >= (st.bad || 0) && (st.ok || 0) > 0){
          mastery[q.cat].masteredQ++;
        }
      }
    }
  });

  let totalWeight = 0;
  let scoreSum = 0;

  for(const c of S.cats){
    const d = mastery[c];
    
    // 1. ความแม่นยำ (Accuracy) 70%
    d.accuracy = d.seenQ > 0 ? Math.round((d.masteredQ / d.seenQ) * 100) : 0;
    
    // 2. การกวาดเนื้อหาในคลัง (Coverage) 30%
    d.coverage = d.totalQ > 0 ? Math.round((d.seenQ / d.totalQ) * 100) : 0;

    // 3. รวมคะแนนถ่วงน้ำหนัก (ล็อกไม่ให้เกิน 100%)
    if(d.seenQ === 0){
      d.pct = 0;
    } else {
      d.pct = clamp(Math.round((d.accuracy * 0.70) + (d.coverage * 0.30)), 0, 100);
    }

    // 4. ตัวตัดเกรดความน่าเชื่อถือ (Data Confidence)
    if(d.seenQ < 10){
      d.confidence = 'low';
      d.statusText = 'เพิ่งเริ่มฝึก (ข้อมูลน้อย)';
    } else if(d.coverage < 35){
      d.confidence = 'medium';
      d.statusText = d.pct >= 60 ? 'ทรงดี แต่ต้องกวาดข้อเพิ่ม' : 'ต้องฝึกข้อใหม่เพิ่ม';
    } else {
      d.confidence = 'high';
      d.statusText = d.pct >= 60 ? '✓ แม่นยำพร้อมสอบ' : '⚠️ ยังไม่ถึงเกณฑ์ 60%';
    }

    // คำนวณภาพรวมโอกาสติด
    const isFocus = track.focusCats && track.focusCats.includes(c);
    const weight = isFocus ? 1.4 : 1.0;
    totalWeight += weight;
    scoreSum += d.pct * weight;
  }

  const passProb = totalWeight > 0 ? clamp(Math.round(scoreSum / totalWeight), 0, 100) : 0;

  let statusText = 'เริ่มต้นลุย';
  let badgeColor = 'var(--muted)';
  let bgGrad = 'linear-gradient(135deg, #7286a6, #41527a)';

  if(passProb >= 80){
    statusText = 'โอกาสติดสูงมาก';
    badgeColor = 'var(--green)';
    bgGrad = 'linear-gradient(135deg, #12a150, #0097a7)';
  } else if(passProb >= 60){
    statusText = 'ผ่านเกณฑ์ลุ้นตัวจริง';
    badgeColor = 'var(--blue)';
    bgGrad = 'linear-gradient(135deg, #2b7cf0, #0097a7)';
  } else if(passProb >= 40){
    statusText = 'ต้องฟิตเพิ่มอีกนิด';
    badgeColor = 'var(--orange)';
    bgGrad = 'linear-gradient(135deg, #f08c00, #ff6b6b)';
  } else {
    statusText = 'ยังไม่ปลอดภัย รีบทวนด่วน';
    badgeColor = 'var(--red)';
    bgGrad = 'linear-gradient(135deg, #e04347, #be4bdb)';
  }

  return { passProb, statusText, badgeColor, bgGrad, mastery };
}

function evaluatePolicePassing(result, trackKey = 'admin'){
  const track = POLICE_TRACKS[trackKey] || POLICE_TRACKS.admin;
  const byCat = result.byCat;
  const overallPct = Math.round(result.correct / result.total * 100);

  if(trackKey === 'suppress'){
    const pass = overallPct >= 60;
    return {
      pass,
      trackName: track.name,
      reason: pass ? `ผ่านเกณฑ์ปราบปราม (${overallPct}%)` : `ต่ำกว่าเกณฑ์ (${overallPct}%)`,
      isComplete: true,
      p1Pct: null,
      p2Pct: null
    };
  }

  let p1T = 0, p1C = 0, p2T = 0, p2C = 0;
  for(const [c, v] of Object.entries(byCat)){
    if(track.p1 && track.p1.includes(c)){ p1T += v.t; p1C += v.c; }
    else if(track.p2 && track.p2.includes(c)){ p2T += v.t; p2C += v.c; }
  }

  const p1Pct = p1T ? Math.round(p1C / p1T * 100) : 0;
  const p2Pct = p2T ? Math.round(p2C / p2T * 100) : 0;

  if(p1T === 0 || p2T === 0){
    const pass = overallPct >= 60;
    return {
      pass,
      trackName: track.name,
      reason: pass ? `ผ่านเฉพาะหมวด (${overallPct}%)` : `ต่ำกว่าเกณฑ์ (${overallPct}%)`,
      isComplete: false,
      note: 'สายอำนวยการต้องทำทั้ง 2 ภาค (≥ 60% ทั้งคู่)',
      p1Pct, p2Pct, p1T, p1C, p2T, p2C
    };
  }

  const passP1 = p1Pct >= 60;
  const passP2 = p2Pct >= 60;
  const pass = passP1 && passP2 && (overallPct >= 60);

  let reason = '';
  if(pass) reason = `ผ่านเกณฑ์อำนวยการ (ภาค 1: ${p1Pct}%, ภาค 2: ${p2Pct}%)`;
  else if(!passP1 && !passP2) reason = `ไม่ผ่านทั้ง 2 ภาค (ภาค 1: ${p1Pct}%, ภาค 2: ${p2Pct}%)`;
  else if(!passP1) reason = `ตกภาค 1 (${p1Pct}%) ต้องได้ ≥ 60%`;
  else reason = `ตกภาค 2 (${p2Pct}%) ต้องได้ ≥ 60%`;

  return { pass, trackName: track.name, reason, isComplete: true, p1Pct, p2Pct, p1T, p1C, p2T, p2C };
}

function initCarousel(totalSlides){
  clearInterval(bannerTimer);
  if(totalSlides <= 1) return;

  const track = $('#bannerTrack');
  const dots = $$('#bannerDots .b-dot');
  bannerIdx = 0;

  function updateSlide(idx){
    bannerIdx = (idx + totalSlides) % totalSlides;
    if(track) track.style.transform = `translateX(-${bannerIdx * 100}%)`;
    dots.forEach((d, i)=>d.classList.toggle('on', i === bannerIdx));
  }

  bannerTimer = setInterval(()=>updateSlide(bannerIdx + 1), 4000);

  const slider = $('#bannerSlider');
  if(!slider) return;

  let startX = 0;
  slider.ontouchstart = e => {
    clearInterval(bannerTimer);
    startX = e.touches[0].clientX;
  };
  slider.ontouchend = e => {
    const endX = e.changedTouches[0].clientX;
    const diff = startX - endX;
    if(Math.abs(diff) > 40){
      playTone('tap');
      updateSlide(diff > 0 ? bannerIdx + 1 : bannerIdx - 1);
    }
    bannerTimer = setInterval(()=>updateSlide(bannerIdx + 1), 4000);
  };
}

let QF={cat:'ทั้งหมด',term:'',sort:'new',star:false,limit:25};
let searchDebounce = null;

const SORT_LABELS = {
  smart: 'แนะนำ',
  order: 'ตามลำดับ',
  unseen: 'ยังไม่ทำ',
  wrong: 'จุดอ่อน',
  hard: 'ยากก่อน',
  new: 'ล่าสุด',
  cat: 'ตามหมวด'
};

function escapeRegExp(string) {
  return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlightMatch(text, term) {
  if (!term || !text) return esc(text);
  try {
    const escaped = escapeRegExp(term);
    const regex = new RegExp(`(${escaped})`, 'gi');
    return esc(text).replace(regex, '<span class="search-highlight">$1</span>');
  } catch(e) {
    return esc(text);
  }
}

function qFiltered(){
  let L = S.questions;
  if(QF.cat !== 'ทั้งหมด') L = L.filter(q => q.cat === QF.cat);
  if(QF.star) L = L.filter(q => q.star);
  if (QF.sort === 'unseen') {
    L = L.filter(q => !(S.qstat[q.id]?.seen > 0));
  } else if (QF.sort === 'wrong') {
    L = L.filter(q => (S.qstat[q.id]?.bad || 0) > 0);
  }
  if(QF.term) {
    const terms = QF.term.split(/\s+/).filter(Boolean);
    L = L.filter(q => {
      const targetStr = (q.q + ' ' + q.c.join(' ') + ' ' + (q.e || '')).toLowerCase();
      return terms.every(term => targetStr.includes(term));
    });
  }

  if (QF.sort === 'smart') {
    const diffScore = { 'ยาก': 3, 'ปานกลาง': 2, 'ง่าย': 1 };
    L.sort((a, b) => {
      const sa = S.qstat[a.id] || { bad: 0, seen: 0 };
      const sb = S.qstat[b.id] || { bad: 0, seen: 0 };
      const scoreA = ((sa.bad || 0) * 3) + (sa.seen === 0 ? 5 : 0) + (diffScore[a.d] || 0);
      const scoreB = ((sb.bad || 0) * 3) + (sb.seen === 0 ? 5 : 0) + (diffScore[b.d] || 0);
      return scoreB - scoreA;
    });
  } else if (QF.sort === 'order') {
    L.sort((a, b) => (a.idx ?? 0) - (b.idx ?? 0));
  } else if (QF.sort === 'unseen') {
    L.sort((a, b) => ((S.qstat[a.id]?.seen || 0) - (S.qstat[b.id]?.seen || 0)));
  } else if (QF.sort === 'wrong') {
    L.sort((a, b) => ((S.qstat[b.id]?.bad || 0) - (S.qstat[a.id]?.bad || 0)));
  } else if (QF.sort === 'hard') {
    const diffScore = { 'ยาก': 3, 'ปานกลาง': 2, 'ง่าย': 1 };
    L.sort((a, b) => (diffScore[b.d] || 0) - (diffScore[a.d] || 0));
  } else if (QF.sort === 'cat') {
    L.sort((a, b) => (a.cat || '').localeCompare(b.cat || '', 'th'));
  }
  return L;
}
