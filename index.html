            <button class="ib sm" data-drop="${q.id}"><i data-lucide="trash-2"></i></button>
          </div>
        </div>

        ${q.e ? `
          <div style="display:block!important;width:100%!important;box-sizing:border-box!important;margin:8px 0 4px 0!important;font-size:13.5px!important;color:var(--text2)!important;white-space:pre-wrap!important;line-height:1.65!important;border-left:3.5px solid var(--blue)!important;padding:10px 14px!important;background:var(--surface2)!important;border-radius:0 12px 12px 0!important;">
            💡 ${highlightMatch(q.e, QF.term)}
          </div>` : ''}

        ${(q.eImgs && q.eImgs.length) ? `
          <div class="q-media-box" style="margin-top:8px">
            ${q.eImgs.map((img, idx) => `<img src="${img}" class="q-media-img" style="--img-w:${ew}" onclick="openLightboxGallery(${eImgsJson},${idx})">`).join('')}
          </div>` : ''}

        <div class="meta" style="margin-top:4px">
          <span class="tag b">${esc(q.cat)}</span>
          <span class="tag ${q.d==='ยาก'?'r':q.d==='ปานกลาง'?'o':'g'}">${esc(q.d||'ง่าย')}</span>
          ${st?`<span class="tag">ถูก ${st.ok} · ผิด ${st.bad}</span>`:''}
        </div>
      </div>`;
    }).join('') : `
    <div class="card empty" style="grid-column:1/-1;width:100%;box-sizing:border-box;padding:48px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0;">                     
        <i data-lucide="search-x" style="width:40px;height:40px;margin-bottom:10px;color:var(--muted)"></i>
        <b style="font-size:16px;display:block;margin-bottom:4px">ไม่พบข้อมูลในการค้นหา</b>
        <small style="color:var(--muted)">ลองเปลี่ยนคำค้นหา หรือตรวจสอบตัวสะกดใหม่อีกครั้ง</small>
      </div>
    `}
  </div>
  ${L.length > QF.limit && showCategorySection ? `<button class="btn ghost block" id="more" style="margin-top:10px"><i data-lucide="chevron-down"></i>ดูเพิ่ม 25 ข้อ</button>` : ''}`;

  const qs = $('#qs');
  qs.oninput = e => {
    clearTimeout(searchDebounce);
    const val = e.target.value;
    searchDebounce = setTimeout(() => {
      QF.term = val.trim().toLowerCase();
      QF.limit = 25;
      renderQuiz();
      const n = $('#qs'); if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    }, 250);
  };

  if($('#qsClear')) $('#qsClear').onclick=()=>{ playTone('tap'); QF.term=''; QF.limit=25; renderQuiz(); };
  $$('[data-c]').forEach(b=>b.onclick=()=>{ playTone('tap'); QF.cat=b.dataset.c; QF.batchIdx=undefined; QF.limit=25; renderQuiz(); });
  $('#fStar').onclick=()=>{ playTone('tap'); QF.star=!QF.star; renderQuiz(); };

  $('#btnSort').onclick=()=>{ openPicker({
    title: 'จัดเรียง',
    options: [
      { val: 'smart',  label: 'แนะนำ' },
      { val: 'order',  label: 'ตามลำดับข้อ' },
      { val: 'unseen', label: 'ยังไม่เคยทำ' },
      { val: 'wrong',  label: 'จุดอ่อน/ผิดบ่อย' },
      { val: 'hard',   label: 'ยากก่อน' }
    ],
    value: QF.sort,
    onSelect: v => { QF.sort = v; renderQuiz(); }
  }); };

  $$('[data-play]').forEach(b => {
    b.onclick = () => {
      playTone('tap');
      const catName = b.dataset.play;
      const allQs = S.questions.filter(q => q.cat === catName);
      if (!allQs.length) return toast('ไม่มีข้อสอบในหมวดนี้', 'err');

      const BATCH_SIZE = 50;
      const totalBatches = Math.ceil(allQs.length / BATCH_SIZE);

      const body = `
        <div style="display:flex;flex-direction:column;gap:14px;padding:2px">
          <div style="background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-size:15px;font-weight:700;color:var(--text)">${esc(catName)}</div>
                <div style="font-size:12px;color:var(--muted);margin-top:2px">ทั้งหมด ${allQs.length} ข้อ · แบ่ง ${totalBatches} ชุด</div>
              </div>
              <button class="btn sm" id="btnQuickRandom20" style="border-radius:12px;padding:6px 12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);color:var(--text)">
                <i data-lucide="shuffle" style="width:14px;height:14px"></i>สุ่มด่วน (20)
              </button>
            </div>

            <label style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding-top:10px;border-top:1px solid rgba(0,0,0,0.05)">
              <span style="font-size:12.5px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px">
                <i data-lucide="timer-off" style="width:15px;height:15px;color:var(--muted)"></i>ไม่จำกัดเวลา
              </span>
              <div style="position:relative;width:40px;height:22px">
                <input type="checkbox" id="chkNoTimeLimit" style="opacity:0;width:0;height:0">
                <div id="toggleTrack" style="position:absolute;inset:0;background:var(--line);border-radius:99px;transition:0.25s"></div>
                <div id="toggleThumb" style="position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:0.25s"></div>
              </div>
            </label>
          </div>

          <div style="display:grid;grid-template-columns:repeat(2, 1fr);gap:10px;max-height:340px;overflow-y:auto;padding:2px">
            ${Array.from({ length: totalBatches }).map((_, idx) => {
              const startNo = idx * BATCH_SIZE + 1;
              const endNo = Math.min((idx + 1) * BATCH_SIZE, allQs.length);
              const batchQs = allQs.slice(startNo - 1, endNo);
              const doneCount = batchQs.filter(q => (S.qstat[q.id]?.seen || 0) > 0).length;
              const totalInBatch = batchQs.length;
              const pct = Math.round((doneCount / totalInBatch) * 100);
              const isAllDone = doneCount === totalInBatch;

              return `
                <div class="picker-item" data-batchidx="${idx}" style="cursor:pointer;flex-direction:column;align-items:stretch;gap:8px;padding:12px;margin:0;border-radius:16px;background:var(--surface);border:1px solid ${isAllDone ? 'rgba(16,185,129,0.25)' : 'var(--line)'}">
                  <div style="display:flex;justify-content:space-between;align-items:center">
                    <span style="font-size:13.5px;font-weight:700;color:var(--text)">ชุดที่ ${idx + 1}</span>
                    <span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:${isAllDone ? 'rgba(16,185,129,0.1)' : 'rgba(37,99,235,0.08)'};color:${isAllDone ? '#10b981' : 'var(--blue)'}">
                      ${doneCount}/${totalInBatch}
                    </span>
                  </div>
                  <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)">
                    <span>ข้อ ${startNo}–${endNo}</span>
                    <span style="font-weight:600">${pct}%</span>
                  </div>
                  <div style="width:100%;height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)">
                    <div style="width:${pct}%;height:100%;background:${isAllDone ? '#10b981' : 'var(--blue)'};border-radius:99px;"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      openModal(`ชุดข้อสอบ: ${esc(catName)}`, body, `<button class="btn ghost block" data-close style="border-radius:14px">ปิด</button>`);

      const chk = $('#chkNoTimeLimit');
      const track = $('#toggleTrack');
      const thumb = $('#toggleThumb');
      chk.onchange = () => {
        if (chk.checked) {
          track.style.background = 'var(--blue)';
          thumb.style.transform = 'translateX(18px)';
        } else {
          track.style.background = 'var(--line)';
          thumb.style.transform = 'translateX(0)';
        }
      };

      $('#btnQuickRandom20').onclick = () => {
        const noTime = chk?.checked;
        closeModal();
        startExam({ cats: [catName], count: 20, minutes: noTime ? 0 : 20, mode: 'practice', label: `สุ่ม ${catName} 20 ข้อ` });
      };

      $$('[data-batchidx]').forEach(btn => {
        btn.onclick = () => {
          const noTime = chk?.checked;
          const idx = +btn.dataset.batchidx;
          const batchQs = allQs.slice(idx * BATCH_SIZE, (idx + 1) * BATCH_SIZE);
          
          let unseenQs = batchQs.filter(q => (S.qstat[q.id]?.seen || 0) === 0);
          
          if (!unseenQs.length) {
            batchQs.forEach(q => {
              if (S.qstat[q.id]) S.qstat[q.id].seen = 0;
            });
            save();
            unseenQs = batchQs;
          }

          closeModal();
          startExam({
            ids: unseenQs.map(q => q.id),
            count: unseenQs.length,
            minutes: noTime ? 0 : Math.round(unseenQs.length * 1.2),
            mode: 'practice',
            label: `${catName} (ชุด ${idx + 1})`
          });
        };
      });
    };
  });

  $$('[data-dropcat]').forEach(b=>b.onclick=async()=>{
    const c=b.dataset.dropcat;
    const n=S.questions.filter(q=>q.cat===c).length;
    if(await ask('ลบหมวดนี้?', n ? `จะลบข้อสอบ "${c}" ทั้งหมด ${n} ข้อ` : `ลบหมวด "${c}"`, 'ลบ')){
      S.questions = S.questions.filter(q=>q.cat!==c);
      S.cats = S.cats.filter(x=>x!==c);
      if(S.catIcons) delete S.catIcons[c];
      if(S.catTones) delete S.catTones[c];
      save();
      renderQuiz();
      syncChrome();
      toast('ลบแล้ว','ok');
    }
  });

  $$('[data-seticon]').forEach(b => {
    b.onclick = () => {
      playTone('tap');
      openIconPicker(b.dataset.seticon);
    };
  });

  $$('[data-drop]').forEach(b=>b.onclick=async()=>{
    if(await ask('ลบข้อนี้?','ข้อสอบจะถูกลบถาวร','ลบ')){
      S.questions=S.questions.filter(x=>x.id!==b.dataset.drop);
      save();
      renderQuiz();
      syncChrome();
      toast('ลบแล้ว','ok');
    }
  });

  $$('[data-star]').forEach(b=>b.onclick=()=>{
    playTone('tap');
    const q=S.questions.find(x=>x.id===b.dataset.star); q.star=!q.star; save();
    b.classList.toggle('on',q.star); toast(q.star?'ติดดาวแล้ว':'ปลดดาวแล้ว');
  });

  $$('[data-edit]').forEach(b=>b.onclick=()=>qForm(S.questions.find(x=>x.id===b.dataset.edit)));

  if($('#more'))$('#more').onclick=()=>{ playTone('tap'); QF.limit+=25; renderQuiz(); };
  $('#btnBulk').onclick=()=>{ playTone('tap'); bulkForm(); };
  if($('#btnRandom'))$('#btnRandom').onclick=()=>{
    playTone('tap');
    startExam({ids:L.map(q=>q.id),count:Math.min(20,L.length),minutes:15,mode:'practice',label:'สุ่มฝึก '+(QF.cat==='ทั้งหมด'?'ทุกหมวด':QF.cat)});
  };

  const btnFB = $('#btnFilterBatch');
  if (btnFB) {
    btnFB.onclick = () => {
      const catQs = S.questions.filter(q => q.cat === QF.cat);
      const BATCH_SIZE = 50;
      const totalBatches = Math.ceil(catQs.length / BATCH_SIZE);

      const itemsHtml = `
        <div style="display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;padding:2px">
          <button class="picker-item" data-bidx="all" style="justify-content:space-between;padding:12px 14px;border-radius:14px;margin:0;background:${QF.batchIdx === undefined ? 'rgba(37,99,235,0.08)' : 'var(--surface)'};border:1px solid ${QF.batchIdx === undefined ? 'var(--blue)' : 'var(--line)'}">
            <b style="font-size:13.5px;color:var(--text)">แสดงทุกชุด (${catQs.length} ข้อ)</b>
            ${QF.batchIdx === undefined ? '<i data-lucide="check" style="width:16px;height:16px;color:var(--blue)"></i>' : ''}
          </button>
          ${Array.from({ length: totalBatches }).map((_, idx) => {
            const startNo = idx * BATCH_SIZE + 1;
            const endNo = Math.min((idx + 1) * BATCH_SIZE, catQs.length);
            const active = QF.batchIdx === idx;
            return `
              <button class="picker-item" data-bidx="${idx}" style="justify-content:space-between;padding:12px 14px;border-radius:14px;margin:0;background:${active ? 'rgba(37,99,235,0.08)' : 'var(--surface)'};border:1px solid ${active ? 'var(--blue)' : 'var(--line)'}">
                <div style="display:flex;flex-direction:column;align-items:flex-start;gap:2px">
                  <b style="font-size:13.5px;color:var(--text)">ชุดที่ ${idx + 1}</b>
                  <small style="color:var(--muted);font-size:11px">ข้อ ${startNo}–${endNo} (${endNo - startNo + 1} ข้อ)</small>
                </div>
                ${active ? '<i data-lucide="check" style="width:16px;height:16px;color:var(--blue)"></i>' : ''}
              </button>
            `;
          }).join('')}
        </div>
      `;

      openModal(`เลือกชุด: ${esc(QF.cat)}`, itemsHtml, `<button class="btn ghost block" data-close style="border-radius:14px">ปิด</button>`);

      $$('[data-bidx]').forEach(b => {
        b.onclick = () => {
          const val = b.dataset.bidx;
          QF.batchIdx = val === 'all' ? undefined : +val;
          closeModal();
          renderQuiz();
        };
      });
    };
  }

  icons();
}

function qForm(q, onSavedCallback = null){
  const d = q || {
    q:'', c:['','','',''], cImgs:['','','',''], cExps:['','','',''], a:0,
    cat: QF.cat!=='ทั้งหมด'?QF.cat:S.cats[0], d:'ง่าย', e:'',
    qImgs:[], eImgs:[], cType:'vertical',
    qImgW: 260, cImgW: 110, eImgW: 240
  };

  let selectedCat = d.cat;
  let ans = d.a;
  let cType = (d.cType === 'box') ? 'box' : (d.cType === 'horizontal') ? 'horizontal' : 'vertical';
  let curQImgs = Array.isArray(d.qImgs) ? [...d.qImgs] : [];
  let curEImgs = Array.isArray(d.eImgs) ? [...d.eImgs] : [];
  let curCImgs = Array.isArray(d.cImgs) ? [...d.cImgs] : ['', '', '', ''];
  let curCExps = Array.isArray(d.cExps) ? [...d.cExps] : ['', '', '', ''];
  let curQW = d.qImgW || 260;
  let curCW = d.cImgW || 110;
  let curEW = d.eImgW || 240;

  function paintUploadPreviews(){
    const qPrev = $('#q_img_preview');
    const ePrev = $('#e_img_preview');
    if(qPrev){
      qPrev.innerHTML = curQImgs.map((src, i) => `
        <div class="img-preview-box">
          <img src="${src}" class="img-thumb" data-view-qi="${i}">
          <button type="button" class="del-btn" data-delqi="${i}">×</button>
        </div>`).join('');
      $$('[data-view-qi]', qPrev).forEach(img => {
        img.onclick = () => openLightboxGallery(curQImgs, +img.dataset.viewQi);
      });
      $$('[data-delqi]', qPrev).forEach(b => {
        b.onclick = () => { curQImgs.splice(+b.dataset.delqi, 1); paintUploadPreviews(); };
      });
    }

    if(ePrev){
      ePrev.innerHTML = curEImgs.map((src, i) => `
        <div class="img-preview-box">
          <img src="${src}" class="img-thumb" data-view-ei="${i}">
          <button type="button" class="del-btn" data-delei="${i}">×</button>
        </div>`).join('');
      $$('[data-view-ei]', ePrev).forEach(img => {
        img.onclick = () => openLightboxGallery(curEImgs, +img.dataset.viewEi);
      });
      $$('[data-delei]', ePrev).forEach(b => {
        b.onclick = () => { curEImgs.splice(+b.dataset.delei, 1); paintUploadPreviews(); };
      });
    }

    [0,1,2,3].forEach(i => {
      const cBox = $('#c_img_box_'+i);
      if(!cBox) return;
      if(curCImgs[i]){
        cBox.innerHTML = `
          <div class="img-preview-box">
            <img src="${curCImgs[i]}" class="img-thumb" style="width:70px;height:70px" data-view-ci="${i}">
            <button type="button" class="del-btn" data-delci="${i}">×</button>
          </div>
        `;
        const cImgEl = cBox.querySelector('[data-view-ci]');
        if(cImgEl) cImgEl.onclick = () => openLightboxGallery([curCImgs[i]], 0);
        cBox.querySelector('[data-delci]').onclick = () => { curCImgs[i] = ''; paintUploadPreviews(); };
      } else {
        cBox.innerHTML = '';
      }
    });
  }

  openModal(q ? 'แก้ไขข้อสอบ' : 'เพิ่มข้อสอบ', `
    <div class="field">
      <label>คำถาม *</label>
      <textarea class="inp" id="f_q" placeholder="พิมพ์คำถาม">${esc(d.q)}</textarea>
      <div class="row" style="margin-top:8px;justify-content:space-between;flex-wrap:wrap;gap:8px">
        <div class="row" style="gap:6px">
          <button type="button" class="btn sm ghost" id="btnAddQImg"><i data-lucide="image-plus"></i>แนบรูปโจทย์</button>
          <button type="button" class="btn sm ghost" onclick="openRichTextEditor('f_q')"><i data-lucide="type"></i>จัดฟอนต์</button>
        </div>
        <div class="row" style="gap:6px">
          <small style="color:var(--muted)">ขนาดรูปโจทย์:</small>
          <input type="range" id="f_qw" min="100" max="600" step="10" value="${curQW}" style="width:100px">
          <small id="txt_qw" style="min-width:36px;font-weight:600">${curQW}px</small>
        </div>
        <input type="file" id="inp_qimg" accept="image/*" hidden>
      </div>
      <div class="img-grid" id="q_img_preview"></div>
    </div>

    <div class="field">
      <label>การจัดวางตัวเลือก</label>
      <div class="chips" id="f_ctype">
        <button type="button" class="chip ${cType==='vertical'?'on':''}" data-ct="vertical">แนวตั้ง</button>
        <button type="button" class="chip ${cType==='horizontal'?'on':''}" data-ct="horizontal">แนวนอน</button>
        <button type="button" class="chip ${cType==='box'?'on':''}" data-ct="box">กล่องข้อความ</button>
      </div>
    </div>

    <div class="field" style="display:flex;align-items:center;justify-content:space-between;background:var(--surface2);padding:10px 12px;border-radius:12px">
      <div>
        <label style="margin:0;font-weight:600">ขนาดรูปชอยส์</label>
        <small style="color:var(--muted)">ปรับพร้อมกัน ก-ง</small>
      </div>
      <div class="row" style="gap:6px">
        <input type="range" id="f_cw" min="60" max="350" step="10" value="${curCW}" style="width:110px">
        <small id="txt_cw" style="min-width:36px;font-weight:600">${curCW}px</small>
      </div>
    </div>

    ${[0,1,2,3].map(i=>`
      <div class="field" style="background:var(--surface2);padding:14px;border-radius:16px;margin-bottom:14px">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <label style="margin:0;font-weight:700">ตัวเลือก ${LB[i]} *</label>
          <div class="row" style="gap:6px">
            <button type="button" class="btn sm ghost" onclick="openRichTextEditor('f_c${i}')" style="padding:4px 9px;font-size:12px">
              <i data-lucide="type"></i>จัดฟอนต์
            </button>
            <button type="button" class="btn sm ghost" data-addcimg="${i}" style="padding:4px 9px;font-size:12px">
              <i data-lucide="image-plus"></i>แนบรูป
            </button>
          </div>
          <input type="file" id="inp_cimg_${i}" accept="image/*" hidden>
        </div>
        <textarea class="inp" id="f_c${i}" placeholder="ข้อความ ${LB[i]}" style="background:var(--surface);min-height:75px">${esc(d.c[i])}</textarea>
        <div id="c_img_box_${i}" style="margin-top:6px"></div>
        <div style="margin-top:10px">
          <div class="row" style="justify-content:space-between;margin-bottom:5px">
            <label style="margin:0;font-size:12.5px;color:var(--muted)">เหตุผลข้อ ${LB[i]} (ทำไมถูก/ผิด)</label>
            <button type="button" class="btn sm ghost" onclick="openRichTextEditor('f_cexp${i}')" style="padding:2px 8px;font-size:11.5px">
              <i data-lucide="type"></i>จัดฟอนต์
            </button>
          </div>
          <textarea class="inp" id="f_cexp${i}" placeholder="พิมพ์เหตุผลหลายบรรทัดได้..." style="background:var(--surface);min-height:70px">${esc(curCExps[i])}</textarea>
        </div>
      </div>`).join('')}

    <div class="field"><label>คำตอบที่ถูก *</label>
      <div class="chips" id="f_a">${[0,1,2,3].map(i=>`<button type="button" class="chip ${d.a===i?'on':''}" data-a="${i}" style="min-width:52px;justify-content:center">${LB[i]}</button>`).join('')}</div>
    </div>
    
    <div class="field">
      <label>หมวดหมู่ *</label>
      <div class="chips" id="f_cats">
        ${S.cats.map(c=>`<button type="button" class="chip ${selectedCat===c?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
      </div>

function bulkForm(){
  openModal('นำเข้าหลายข้อ',`
    <div class="field"><label>คำถาม | ก | ข | ค | ง | เฉลย(1-4) | หมวด | อธิบาย</label>
      <textarea class="inp" id="bk" style="min-height:220px;font-size:13px"
        placeholder="ข้อใดเป็นโทษทางอาญา | ปรับ | กักขัง | ริบทรัพย์สิน | ถูกทุกข้อ | 4 | กฎหมาย | อ้างอิงมาตรา 18"></textarea></div>`,
    `<button class="btn ghost" data-close>ยกเลิก</button><button class="btn" id="bkGo"><i data-lucide="download"></i>นำเข้า</button>`,{focus:'#bk'});

  $('#bkGo').onclick=()=>{
    playTone('tap');
    const lines=$('#bk').value.split('\n').map(x=>x.trim()).filter(Boolean);
    let n=0,skip=0;
    lines.forEach(ln=>{
      const p=ln.split('|').map(x=>x.trim());
      if(p.length<6){skip++;return;}
      const a=parseInt(p[5],10);
      if(!(a>=1&&a<=4)||!p[0]||p.slice(1,5).some(x=>!x)){skip++;return;}

      const formattedQ = p[0].replace(/\\n/g, '\n').replace(/<br\s*\/?>/gi, '\n');
      const formattedChoices = p.slice(1,5).map(c => c.replace(/\\n/g, '\n').replace(/<br\s*\/?>/gi, '\n'));
      const formattedExp = (p[7]||'').replace(/\\n/g, '\n').replace(/<br\s*\/?>/gi, '\n');

      let cat=p[6]||S.cats[0];
      if(!S.cats.includes(cat))S.cats.push(cat);
      S.questions.push({
        id: uid(),
        star: false,
        q: formattedQ,
        c: formattedChoices,
        cImgs: ['','','',''],
        cExps: ['','','',''],
        a: a-1,
        cat,
        d: 'ง่าย',
        e: formattedExp,
        qImgs: [],
        eImgs: [],
        cType: 'vertical'
      });
      n++;
    });
    save();closeModal();renderQuiz();syncChrome();
    n?toast(`นำเข้า ${n} ข้อแล้ว`,'ok'):toast('รูปแบบไม่ถูกต้อง','err');
  };
}

let CFF={cat:'ทั้งหมด',mode:'due',i:0,flip:false,list:'card'};
function cPool(){
  let L=S.cards.filter(c=>CFF.cat==='ทั้งหมด'||c.cat===CFF.cat);
  if(CFF.mode==='due')  L=L.filter(c=>(c.due||0)<=Date.now());
  if(CFF.mode==='hard') L=L.filter(c=>(c.box||0)<=1);
  return L;
}

function bulkCardForm(){
  openModal('นำเข้าบัตร', `
    <div class="field">
      <label>ด้านหน้า | ด้านหลัง | หมวด</label>
      <textarea class="inp" id="bkc" style="min-height:190px;font-size:13px"
        placeholder="พ.ร.บ.ตำรวจแห่งชาติ | พ.ศ. 2565 | กฎหมาย"></textarea>
    </div>`,
    `<button class="btn ghost" data-close>ยกเลิก</button><button class="btn" id="bkcGo"><i data-lucide="download"></i>นำเข้า</button>`,
    {focus:'#bkc'});

  $('#bkcGo').onclick = () => {
    playTone('tap');
    const lines = $('#bkc').value.split('\n').map(x => x.trim()).filter(Boolean);
    let n = 0, skip = 0;
    lines.forEach(ln => {
      const p = ln.split('|').map(x => x.trim());
      if(p.length < 2 || !p[0] || !p[1]){ skip++; return; }
      let cat = p[2] || S.cats[0];
      if(!S.cats.includes(cat)) S.cards.push(cat);
      S.cards.unshift({ id: uid(), f: p[0], b: p[1], fImg: '', bImg: '', fPos: 'bottom', bPos: 'bottom', cat, box: 3, due: 0 });
      n++;
    });
    save(); closeModal(); renderCards(); syncChrome();
    n ? toast(`นำเข้า ${n} ใบแล้ว`, 'ok') : toast('รูปแบบไม่ถูกต้อง', 'err');
  };
}

      renderCards();
      syncChrome();
      toast('ลบแล้ว','ok');
    }
  });

  if(c && CFF.list === 'card'){
    const fc = $('#fc');     if(fc) {       fc.onclick = () => {         playTone('tap');         CFF.flip = !CFF.flip;         fc.classList.toggle('flip', CFF.flip);       };     }      $$('[data-srs]').forEach(b => {
      b.onclick = () => rateCard(c, +b.dataset.srs);
    });

    if($('#cNext')) $('#cNext').onclick = () => step(1);
    if($('#cPrev')) $('#cPrev').onclick = () => step(-1);
    if($('#cShuf')) $('#cShuf').onclick = () => {
      playTone('tap');
      CFF.i = Math.floor(Math.random() * L.length);
      CFF.flip = false;
      renderCards();
      toast('สุ่มใหม่');
    };
    if($('#cEdit')) $('#cEdit').onclick = () => cForm(c);
    if($('#cDrop')) $('#cDrop').onclick = async () => {
      if(await ask('ลบบัตรนี้?', 'บัตรจะถูกลบถาวร', 'ลบ')){
        S.cards = S.cards.filter(x => x.id !== c.id);
        save();
        renderCards();
        syncChrome();
        toast('ลบแล้ว', 'ok');
      }
    };
  }
  icons();

  function step(n){ playTone('tap'); CFF.flip=false; const len=cPool().length||1; CFF.i=(CFF.i+n+len)%len; renderCards(); }
  
  function rateCard(card, level){
    card.box = level;
    const days = SRS_INTERVALS[level];
    card.due = Date.now() + Math.round(days * 864e5);
    save();
    playTone(level >= 2 ? 'ok' : 'wrong');
    const msg = ['ทวนซ้ำวันนี้', 'ทวนอีก 2 วัน', 'ทวนอีก 5 วัน', 'แม่นยำ (อีก 14 วัน)'][level];
    toast(msg, level >= 2 ? 'ok' : 'info');
    CFF.flip = false;
    
    const currentList = cPool();
    const len = currentList.length;
    if(!len){ renderCards(); return; }
    
    CFF.i = (CFF.i + 1) % len;
    renderCards();
  }
}

let EX={live:false,qs:[],order:[],ans:[],flag:[],cuts:[],streakOk:0,streakWrong:0,i:0,left:0,tid:null,mode:'exam',label:'',cfg:null,paused:false,elapsed:0};
let autoNextTimer = null;

function startExam(cfg){
  if(!cfg)return;
  let qs = [];
  const track = POLICE_TRACKS[cfg.track || S.settings.track || 'admin'];

  if(cfg.count === 150 && track && track.quota && (!cfg.cats || !cfg.cats.length)){
    Object.entries(track.quota).forEach(([catName, needCount]) => {
      let catPool = S.questions.filter(q => q.cat === catName && (!cfg.onlyStar || q.star));
      if(S.settings.shuffleQ) catPool = shuffle(catPool);
      qs.push(...catPool.slice(0, needCount));
    });
  } else {
    let rawPool = cfg.ids ? cfg.ids.map(id=>S.questions.find(q=>q.id===id)).filter(Boolean)
                          : poolOf(cfg.cats||[],cfg.onlyStar);
    
    const grouped = {};
    rawPool.forEach(q => {
      grouped[q.cat] = grouped[q.cat] || [];
      grouped[q.cat].push(q);
    });

    for(const cat of S.cats){
      if(grouped[cat]){
        let subPool = grouped[cat];
        if(S.settings.shuffleQ) subPool = shuffle(subPool);
        qs.push(...subPool);
      }
    }

    const want = cfg.count || qs.length;
    if(want < qs.length) qs = qs.slice(0, want);
  }

  if(!qs.length)return toast('ไม่มีข้อสอบ','err');

  EX={live:true,qs,
      order:qs.map(q=>S.settings.shuffleC?shuffle([0,1,2,3]):[0,1,2,3]),
      ans:Array(qs.length).fill(null),flag:Array(qs.length).fill(false),
      cuts:qs.map(()=>[]),
      streakOk:0,
      streakWrong:0,
      i:0,left:(cfg.minutes||0)*60,tid:null,mode:cfg.mode||'exam',
      label:cfg.label||'ชุดข้อสอบ',cfg,paused:false,elapsed:0};
    S.last={...cfg};
  persist();
  go('run'); startClock();
}

function resumeExam(){
  const s=S.session; if(!s)return;
  const qs=s.ids.map(id=>S.questions.find(q=>q.id===id)).filter(Boolean);
  if(qs.length!==s.ids.length){S.session=null;save();go('home');return toast('ชุดเดิมไม่สมบูรณ์','err');}
  EX={live:true,qs,order:s.order,ans:s.ans,flag:s.flag,
      cuts:s.cuts || qs.map(()=>[]),
      streakOk:s.streakOk || 0,
      streakWrong:s.streakWrong || 0,
      i:s.i,left:s.left,tid:null,
      mode:s.mode,label:s.label,cfg:s.cfg,paused:false,elapsed:s.elapsed||0};
  go('run'); startClock();
}

function holdExam(){
  stopClock();
  EX.live=false;
  localStorage.removeItem('pp_active_exam');
  persist();
  save();
}

function persist(){
  if(!EX.qs.length) return;
  S.session = {
    ids: EX.qs.map(q => q.id),
    order: EX.order,
    ans: EX.ans,
    flag: EX.flag,
    cuts: EX.cuts,
    streakOk: EX.streakOk,
    streakWrong: EX.streakWrong,
    i: EX.i,
    left: EX.left,
    mode: EX.mode,
    label: EX.label,
    cfg: EX.cfg,
    elapsed: EX.elapsed
  };
}

function startClock(){ stopClock(); EX.tid=setInterval(clock,1000); }
function stopClock(){ if(EX.tid)clearInterval(EX.tid); EX.tid=null; }
function clock(){
  if(!EX.live||EX.paused||document.hidden)return;
  EX.elapsed++;
  if(EX.cfg.minutes)EX.left--;
  const t=$('#tmr');
  if(t){ 
    t.querySelector('span').textContent=EX.cfg.minutes?mmss(EX.left):mmss(EX.elapsed);
    t.classList.toggle('warn',!!EX.cfg.minutes&&EX.left<=60); 
  }
  if(EX.cfg.minutes&&EX.left<=0){toast('หมดเวลา','err');submitExam(true);}
}

  openModal('ตัดชอยส์', body, `<button class="btn ghost block" data-close>ปิด</button>`);

function paintPal(box){
  if(!box)return;
  box.innerHTML=EX.qs.map((_,i)=>
    `<button class="pal ${EX.ans[i]!==null?'done':''} ${i===EX.i?'cur':''}" data-p="${i}">${i+1}</button>`).join('');

}

function jump(i){ if(i<0||i>=EX.qs.length)return; EX.i=i; persist(); paintQ(); }

function pick(oi){
  if(EX.paused) return;
  const cuts = EX.cuts[EX.i] || [];
  if(cuts.includes(oi)) return;

  const q = EX.qs[EX.i];
  const isInstant = (EX.mode === 'practice');

  if(isInstant && EX.ans[EX.i] !== null) return;
  EX.ans[EX.i] = oi; 
  persist();

  if(isInstant){
    const ok = (oi === q.a);
    const st = S.qstat[q.id] = S.qstat[q.id] || {seen:0, ok:0, bad:0, streakOk:0, streakBad:0};
    st.seen++; 
    ok ? st.ok++ : st.bad++;
    
    evaluateAdaptiveDifficulty(q.id, ok);

    const d = day(); 
    d.answered++; 
    if(ok) d.correct++;
    d.todayCat[q.cat] = (d.todayCat[q.cat] || 0) + 1;

    paintQ();
    playTone(ok ? 'ok' : 'wrong');

    clearTimeout(autoNextTimer);
    if(S.settings.autoNext && EX.i < EX.qs.length - 1) {
      autoNextTimer = setTimeout(() => jump(EX.i + 1), 1200);
    }
  } else {
    playTone('pick');
    const optButtons = document.querySelectorAll('#opts .opt');
    optButtons.forEach(btn => {
      btn.classList.toggle('on', +btn.dataset.o === oi);
    });

    const palBtn = document.querySelector(`.palgrid [data-p="${EX.i}"]`);
    if(palBtn) palBtn.classList.add('done');

    clearTimeout(autoNextTimer);
    if(S.settings.autoNext && EX.i < EX.qs.length - 1) {
      autoNextTimer = setTimeout(() => jump(EX.i + 1), 200);
    }
  }
}

function submitExam(timeup){
  stopClock(); EX.live=false;
  const total=EX.qs.length; let correct=0, byCat={}, wrong=[];
  const d=day();

  EX.qs.forEach((q,i)=>{
    byCat[q.cat]=byCat[q.cat]||{t:0,c:0}; byCat[q.cat].t++;
    const a=EX.ans[i];
    if(EX.mode!=='practice'){
      const st=S.qstat[q.id]=S.qstat[q.id]||{seen:0,ok:0,bad:0,streakOk:0,streakBad:0};
      if(a!==null){
        st.seen++; 
        const isCorrect = (a===q.a);
        isCorrect?st.ok++:st.bad++;
        evaluateAdaptiveDifficulty(q.id, isCorrect);
        d.todayCat[q.cat] = (d.todayCat[q.cat] || 0) + 1;
      }
    }
    if(a===q.a){correct++;byCat[q.cat].c++;}
    else wrong.push({id:q.id,picked:a});
  });

  const blank=EX.ans.filter(a=>a===null).length;
  if(EX.mode!=='practice'){ d.answered+=total-blank; d.correct+=correct; }
  
  const trackKey = (EX.cfg && EX.cfg.track) || S.settings.track || 'admin';
  const evalResult = evaluatePolicePassing({correct, total, byCat}, trackKey);

  S.results.unshift({
    id:uid(),date:new Date().toISOString(),label:EX.label,mode:EX.mode,
    total,correct,wrong:total-correct-blank,blank,used:EX.elapsed,byCat,wrongList:wrong,
    cfg:EX.cfg,timeup:!!timeup,trackKey,evalResult
  });
  S.results=S.results.slice(0,60);
  S.session=null; 
  save();
  
  playTone('submit');

  openModal('สรุปส่งข้อสอบ', `
    <div style="text-align:center;padding:24px 10px;">
      <div style="font-size:16px;font-weight:700;margin-bottom:8px">กำลังประมวลผลคำตอบ...</div>
      <div style="height:6px;width:80%;max-width:240px;background:var(--surface3);border-radius:10px;margin:12px auto;overflow:hidden">
       <div id="progBar" style="height:100%;width:0%;background:var(--blue);border-radius:10px;"></div>
      </div>
      <small style="color:var(--text2);font-size:12px">กำลังตรวจนับและสรุปผลคะแนน...</small>
    </div>
  `, '');

  setTimeout(() => {
    closeModal();
    go('result');
    toast('ส่งแล้ว', 'ok');
  }, 2400);
}

function getSmartExamLabel(x) {
  if (x.mode === 'wrong' || (x.label && x.label.includes('ข้อผิด'))) {
    return `ทบทวนข้อผิด (${x.total} ข้อ)`;
  }
  if (x.total === 150) {
    return 'จำลองสอบจริง (150 ข้อ)';
  }
  if (x.subject || (x.label && !x.label.startsWith('สอบ '))) {
    const baseName = x.subject || x.label.replace(/\s*\(ชุด\s*\d+\)/, '');
    const setNum = (x.label && x.label.match(/\(ชุด\s*\d+\)/)) ? ` ${x.label.match(/\(ชุด\s*\d+\)/)[0]}` : '';
    return `${baseName}${setNum} (${x.total} ข้อ)`;
  }
  return `ชุดทดสอบสุ่ม (${x.total} ข้อ)`;
}

 </div>

function openRoundDetail(resultId, selectedCat = null){
  const res = S.results.find(x => x.id === resultId);
  if(!res) return;

  const pct = Math.round(res.correct / res.total * 100);
  const ev = res.evalResult || evaluatePolicePassing(res, res.trackKey || 'admin');

  // ==========================================
  // VIEW 2: หน้ารายละเอียดข้อผิด (Full Screen Sheet)

    const catStat = res.byCat[selectedCat] || { c: 0, t: 0 };

      const cw = q.cImgW ? `${q.cImgW}px` : '110px';
      const ew = q.eImgW ? `${q.eImgW}px` : '100%';

      const pickedImg = w.picked !== null && q.cImgs && q.cImgs[w.picked];
      const correctImg = q.cImgs && q.cImgs[q.a];
      const choiceExpPicked = (w.picked !== null && q.cExps && q.cExps[w.picked]) ? q.cExps[w.picked].trim() : '';
      const choiceExpCorrect = (q.cExps && q.cExps[q.a]) ? q.cExps[q.a].trim() : '';

      // กรองช่องว่าง ย่อหน้า อักขระพิเศษ และ HTML entities ด้านหน้าออกทั้งหมด
      const cleanQuestion = (q.q || '')
        .replace(/^[\s\u00A0\u200B\uFEFF]+/g, '')

        ${(q.eImgs && q.eImgs.length) ? `
          <div class="q-media-box" style="margin-top:10px">
            ${q.eImgs.map((img, i) => `<img src="${img}" class="q-media-img" style="--img-w:${ew}" onclick="openLightboxGallery(${eImgsJson}, ${i})">`).join('')}
          </div>` : ''}
      </div>
    `;}).join('') : `
      <div style="text-align:center;padding:70px 16px;color:var(--muted)">
        <div style="width:54px;height:54px;border-radius:50%;background:rgba(16,185,129,0.1);color:#10b981;display:grid;place-items:center;margin:0 auto 12px">
          <i data-lucide="award" style="width:28px;height:28px"></i>
        </div>
        <b style="font-size:17px;color:var(--text);display:block;margin-bottom:4px">ไม่มีข้อผิดพลาด</b>
        <small style="font-size:13px">วิชานี้ตอบถูกครบทุกข้อ</small>

    fsWrap.innerHTML = `
      <!-- Header -->

              <b style="font-size:15.5px;color:var(--text);display:block;line-height:1.2">${esc(selectedCat)}</b>

function applyActiveFont() {
  const st = S.settings;
  let fontStyle = document.getElementById('custom-font-style');
  if (!fontStyle) {
    fontStyle = document.createElement('style');
    fontStyle.id = 'custom-font-style';
    document.head.appendChild(fontStyle);
  }

  const active = (st.customFonts || []).find(f => f.id === st.activeFontId);
  if (active && active.data) {
    fontStyle.innerHTML = `
      @font-face {
        font-family: 'AppCustomFont';
        src: url(${active.data});
      }
      body, button, input, select, textarea, h1, h2, h3, b {
        font-family: 'AppCustomFont', 'Sarabun', sans-serif !important;
      }
      .rq, .face .q, .opt-text, .opt-boxed-text, .qt, .fcard .fin, .rte-area {
        font-family: 'Sarabun', sans-serif !important;
      }        
    `;
  } else {
    fontStyle.innerHTML = '';
  }
}

function openFontManagerModal() {
  playTone('tap');
  const list = S.settings.customFonts || [];
  const curId = S.settings.activeFontId || '';

  const body = `
    <div style="display:flex;flex-direction:column;gap:10px">
      <input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2" hidden>
      <button class="btn blue block" id="btnUploadNewFont">
        <i data-lucide="plus"></i> อัปโหลดฟอนต์ใหม่ (.ttf / .otf)
      </button>

      <div style="font-size:12.5px;color:var(--muted);margin-top:6px">ฟอนต์ที่มีในระบบ:</div>
      <div style="display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto">
        <button class="picker-item ${!curId ? 'on' : ''}" data-choosefont="">
          <span>ค่าเริ่มต้น (Sarabun)</span>
          <span class="chk"><i data-lucide="check" style="width:14px;height:14px"></i></span>
        </button>
        ${list.map(f => `
          <div class="picker-item ${curId === f.id ? 'on' : ''}" style="cursor:pointer" data-choosefont="${f.id}">
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span>
            <div class="row" style="gap:6px">
              <span class="chk"><i data-lucide="check" style="width:14px;height:14px"></i></span>
              <button class="ib sm red" data-delfont="${f.id}" title="ลบ" onclick="event.stopPropagation()"><i data-lucide="trash-2"></i></button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  openModal('จัดการฟอนต์ในแอป', body, `<button class="btn ghost block" data-close>ปิด</button>`);

  $('#btnUploadNewFont').onclick = () => $('#fontFileInput').click();
  $('#fontFileInput').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const fontName = file.name.replace(/\.[^/.]+$/, "");
      S.settings.customFonts = S.settings.customFonts || [];
      const newId = uid();
      S.settings.customFonts.push({ id: newId, name: fontName, data: reader.result });
      S.settings.activeFontId = newId;
      save();
      applyActiveFont();
      openFontManagerModal();
      toast('เพิ่มและใช้ฟอนต์แล้ว', 'ok');
    };
    reader.readAsDataURL(file);
  };

  $$('[data-choosefont]').forEach(btn => {     
    btn.onclick = () => {       
      playTone('tap');       
      S.settings.activeFontId = btn.dataset.choosefont;       
      save();       
      applyActiveFont();       
      openFontManagerModal();       
      toast('เปลี่ยนฟอนต์แล้ว', 'ok');     
    };   
  });    

  $$('[data-delfont]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      playTone('tap');
      const fid = btn.dataset.delfont;
      S.settings.customFonts = S.settings.customFonts.filter(x => x.id !== fid);
      if (S.settings.activeFontId === fid) S.settings.activeFontId = '';
      save();
      applyActiveFont();
      openFontManagerModal();
      toast('ลบฟอนต์แล้ว');
    };
  });
}

(async function initApp(){
  try{
    await initDB();
    const stored = await dbGet('state');
    if(stored && Array.isArray(stored.questions)){
      S = stored;
      let updated = false;
      S.questions.forEach(q => {
        if(!q.d || q.d !== 'ง่าย'){
          q.d = 'ง่าย';
          updated = true;
        }
      });
      if(updated) save();
    }else{
      S = fresh();
      await dbSet('state', S);
    }
  }catch(e){
    console.warn('IndexedDB fallback', e);
  }

  day();
  theme();
  updateSidebarProfile();

  let activeSnap = null;
  try {
    const raw = localStorage.getItem('pp_active_exam');
    if(raw) activeSnap = JSON.parse(raw);
  } catch(e){}

  if(activeSnap && Array.isArray(activeSnap.ids) && activeSnap.ids.length){
    S.session = activeSnap;
    resumeExam();
  }else{
    go('home');
  }
  icons();
})();

  }

const GDRIVE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqICoNiiit799JliNB4OugQQbTQhLhNggB0SmXWmCg-xs7Lzlc2VrEnoXm0yOk0Gg2/exec";
let cloudCache = null;

async function openCloudHubModal(forceRefresh = false) {
  playTone('tap');

  if (cloudCache && !forceRefresh) {
    renderCloudHub(cloudCache);
    return;
  }

  openModal('คลังข้อสอบออนไลน์ (Google Drive)', 
    '<div style="text-align:center;padding:24px 16px" id="hubLoading">' +
      '<div style="font-size:36px;font-weight:900;color:var(--primary);margin-bottom:8px" id="hubLoadingPercent">0%</div>' +
      '<div style="background:var(--line);height:8px;border-radius:99px;overflow:hidden;margin:0 auto 12px;max-width:220px">' +
        '<div id="hubLoadingBar" style="background:#2563eb;height:100%;width:0%;transition:width 0.15s ease"></div>' +
      '</div>' +
      '<div style="font-size:13px;color:var(--muted)" id="hubLoadingStatus">กำลังดึงข้อมูลจาก Google Drive...</div>' +
    '</div>',
    ''
  );

  let pct = 0;
  const pText = $('#hubLoadingPercent');
  const pBar = $('#hubLoadingBar');

  const timer = setInterval(() => {
    if (pct < 90) {
      pct += Math.floor(Math.random() * 5) + 3;
      if (pct > 90) pct = 90;
      if (pText) pText.textContent = pct + '%';
      if (pBar) pBar.style.width = pct + '%';
    }
  }, 100);

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 12000);

  try {
    const res = await fetch(GDRIVE_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "list" }),
      signal: controller.signal
    });

    clearTimeout(timeoutId);
    const data = await res.json();

    clearInterval(timer);
    if (pText) pText.textContent = '100%';
    if (pBar) pBar.style.width = '100%';
    await new Promise(r => setTimeout(r, 150));

    cloudCache = data;
    renderCloudHub(data);

  } catch (err) {
    clearInterval(timer);
    clearTimeout(timeoutId);
    const loadingBox = $('#hubLoading');
    if (loadingBox) {
      loadingBox.innerHTML = 
        '<div style="color:#ef4444;font-size:14px;font-weight:700;margin-bottom:12px">การเชื่อมต่อล่าช้าหรืออินเทอร์เน็ตขัดข้อง</div>' +
        '<button class="btn btn-sm" onclick="openCloudHubModal(true)" style="background:#2563eb;color:#fff;padding:8px 18px;border-radius:10px">ลองใหม่อีกครั้ง</button>';
    }
  }
}

function renderCloudHub(data) {
  const TOTAL_LIMIT = 1024 * 1024 * 1024 * 1024;
  const usedMB = (data.totalBytes / (1024 * 1024)).toFixed(1);
  const percentVal = ((data.totalBytes / TOTAL_LIMIT) * 100).toFixed(2);

  openModal('คลังข้อสอบออนไลน์ (Google Drive)', 
    '<div style="padding:4px 0">' +
      '<div style="background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:16px">' +
        '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px">' +
          '<span>พื้นที่สำรองข้อมูล</span>' +
          '<b>' + usedMB + ' MB / 1 TB (' + percentVal + '%)</b>' +
        '</div>' +
        '<div style="background:var(--line);height:6px;border-radius:99px;overflow:hidden">' +
          '<div style="background:#2563eb;width:' + Math.max(0.5, percentVal) + '%;height:100%"></div>' +
        '</div>' +
      '</div>' +

      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
        '<b style="font-size:15px">รายการวิชาบนคลาวด์</b>' +
        '<button class="btn btn-sm" onclick="triggerUploadPicker()" style="background:#10b981;color:#fff;border-radius:10px;padding:6px 12px;font-weight:700">' +
          '<i data-lucide="upload" style="width:14px;height:14px;margin-right:4px"></i> ฝากข้อสอบ' +
        '</button>' +
      '</div>' +

      '<div id="cloudList" style="max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:8px">' +
        (!data.items || !data.items.length 
          ? '<div style="text-align:center;padding:24px;color:var(--muted)">ยังไม่มีข้อสอบบนคลาวด์</div>' 
          : data.items.map(item => 
              '<div style="display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--line);padding:10px 14px;border-radius:14px">' +
                '<div>' +
                  '<b style="font-size:14px;display:block">' + esc(item.name) + '</b>' +
                  '<small style="color:var(--muted)">' + item.count + ' ข้อ · ' + (item.size / (1024*1024)).toFixed(1) + ' MB · ' + item.date + '</small>' +
                '</div>' +
                '<div style="display:flex;gap:6px">' +
                  '<button class="btn btn-sm" onclick="downloadCloudFile(\'' + item.id + '\', \'' + esc(item.name) + '\')" style="background:#2563eb;color:#fff;border-radius:8px;padding:6px 10px">' +
                    '<i data-lucide="download" style="width:14px;height:14px"></i> โหลด' +
                  '</button>' +
                  '<button class="btn btn-sm" onclick="deleteCloudFile(\'' + item.fileName + '\', \'' + esc(item.name) + '\')" style="background:#ef4444;color:#fff;border-radius:8px;padding:6px 10px">' +
                    '<i data-lucide="trash-2" style="width:14px;height:14px"></i>' +
                  '</button>' +
                '</div>' +
              '</div>'
            ).join('')
        ) +
      '</div>' +
    '</div>',
    ''
  );

  if (window.lucide) lucide.createIcons();
}

window.downloadCloudFile = async (fileId, subName) => {
  toast('กำลังดาวน์โหลด ' + subName + '...', 'info');
  try {
    const res = await fetch(GDRIVE_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "download", fileId: fileId })
    });
    const data = await res.json();
    if (data.questions && data.questions.length) {
      if (data.catIcons) {
        S.catIcons = Object.assign(S.catIcons || {}, data.catIcons);
      }
      if (data.catTones) {
        S.catTones = Object.assign(S.catTones || {}, data.catTones);
      }

      data.questions.forEach(q => {
        if (q.cat && !S.cats.includes(q.cat)) {
          S.cats.push(q.cat);
        }
      });

      if (subName === 'รวมทุกวิชา') {
        S.questions = data.questions;
      } else {
        S.questions = [...S.questions.filter(q => q.cat !== subName), ...data.questions];
      }

      save();
      syncChrome();
      if (typeof renderQuiz === 'function' && PAGE === 'quiz') renderQuiz();
      if (typeof renderHome === 'function' && PAGE === 'home') renderHome();

      toast('นำเข้าวิชา "' + subName + '" สำเร็จ (' + data.questions.length + ' ข้อ)', 'ok');
      closeModal();
    }
  } catch(e) {
    toast('ดาวน์โหลดล้มเหลว ตรวจสอบอินเทอร์เน็ต', 'err');
  }
};

      '<div style="display:flex;gap:10px;justify-content:center">' +
        '<button class="btn btn-sub" onclick="closeModal()">ยกเลิก</button>' +

  );

  $('#btnConfirmDelete').onclick = async () => {

      await fetch(GDRIVE_SCRIPT_URL, {

    }
  };
};

window.triggerUploadPicker = function() {
  playTone('tap');
  const options = [
    { val: '__ALL__', label: 'ทุกวิชาทั้งหมด (' + S.questions.length + ' ข้อ)' },
    ...S.cats.map(c => ({ val: c, label: c + ' (' + S.questions.filter(q=>q.cat===c).length + ' ข้อ)' }))
  ];
  
  openPicker({
    title: 'เลือกวิชาที่จะฝากขึ้น Google Drive',
    options,
    value: '',
    onSelect: async (selected) => {
      const toUploadQs = selected === '__ALL__' 
        ? S.questions 
        : S.questions.filter(q => q.cat === selected);

      if(!toUploadQs.length) return toast('ไม่มีข้อสอบในหมวดนี้', 'err');

      const subName = selected === '__ALL__' ? 'รวมทุกวิชา' : selected;
      const totalQuestions = toUploadQs.length;
      const jsonString = JSON.stringify({
        questions: toUploadQs,
        catIcons: S.catIcons || {},
        catTones: S.catTones || {}
      });

      const CHUNK_SIZE = 10 * 1024 * 1024;
      const totalChunks = Math.ceil(jsonString.length / CHUNK_SIZE);

      document.body.style.pointerEvents = 'none';
      document.body.style.userSelect = 'none';

      const overlay = document.createElement('div');
      overlay.id = 'chunkUploadOverlay';
      overlay.style.cssText = 
        'position:fixed;inset:0;background:rgba(15,23,42,0.85);' +
        'z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;' +
        'pointer-events:auto;';

      overlay.innerHTML = 
        '<div style="background:var(--surface,#ffffff);width:100%;max-width:380px;border-radius:24px;' +
        'padding:28px 24px;text-align:center;box-shadow:0 15px 35px rgba(0,0,0,0.3);' +
        'border:2px solid var(--line,#e2e8f0);">' +
          
          '<div style="width:54px;height:54px;border-radius:16px;background:rgba(37,99,235,0.1);' +
          'display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#2563eb;" id="upBoxIcon">' +
            '<i data-lucide="cloud-upload" style="width:28px;height:28px"></i>' +
          '</div>' +

          '<div style="font-size:18px;font-weight:800;color:var(--text,#0f172a);margin-bottom:4px">กำลังสำรองข้อมูล</div>' +
          '<div style="font-size:13px;color:var(--muted,#64748b);margin-bottom:20px">' + subName + '</div>' +

          '<div style="font-size:48px;font-weight:900;letter-spacing:-1px;color:#2563eb;margin-bottom:12px;font-variant-numeric:tabular-nums;line-height:1" id="upNum">0%</div>' +

          '<div style="width:100%;height:12px;background:var(--line,#e2e8f0);border-radius:99px;overflow:hidden;margin-bottom:14px;border:1px solid rgba(0,0,0,0.05)">' +
            '<div id="upFill" style="width:0%;height:100%;background:#2563eb;border-radius:99px;transition:width 0.15s ease-out"></div>' +
          '</div>' +

          '<div style="font-size:13px;font-weight:700;color:var(--text,#1e293b);margin-bottom:4px" id="upTextInfo">เตรียมส่งข้อมูล... (0/' + totalChunks + ' ส่วน)</div>' +
          '<div style="font-size:12px;color:var(--muted,#94a3b8);margin-bottom:24px" id="upSubInfo">ระบบกำลังส่งข้อมูล ห้ามปิดหรือสลับแอป</div>' +

          '<button id="btnFinishUpload" style="display:none;width:100%;padding:14px;border-radius:14px;background:#2563eb;color:#fff;border:none;font-weight:800;font-size:15px;cursor:pointer;">เสร็จสิ้น</button>' +
        '</div>';

      document.body.appendChild(overlay);
      if (window.lucide) lucide.createIcons();

      const preventNav = (e) => { e.preventDefault(); e.returnValue = ''; };
      window.addEventListener('beforeunload', preventNav);

      const upNum = document.getElementById('upNum');
      const upFill = document.getElementById('upFill');
      const upTextInfo = document.getElementById('upTextInfo');
      const upSubInfo = document.getElementById('upSubInfo');
      const btnFinishUpload = document.getElementById('btnFinishUpload');
      const upBoxIcon = document.getElementById('upBoxIcon');

      let displayPercent = 0;
      let targetPercent = 0;
      let isDone = false;

      const progressTicker = setInterval(() => {
        if (isDone) return;
        if (displayPercent < targetPercent) {
          displayPercent += Math.min(2, targetPercent - displayPercent);
        } else if (displayPercent < 95) {
          if (Math.random() > 0.4) {
            displayPercent += 1;
          }
        }
        if (upNum) upNum.textContent = displayPercent + '%';
        if (upFill) upFill.style.width = displayPercent + '%';
      }, 120);

      try {
        for (let i = 0; i < totalChunks; i++) {
          const start = i * CHUNK_SIZE;
          const end = Math.min(start + CHUNK_SIZE, jsonString.length);
          const chunkData = jsonString.substring(start, end);

          if (upTextInfo) upTextInfo.textContent = 'กำลังส่งส่วนที่ ' + (i + 1) + '/' + totalChunks + '...';

          await fetch(GDRIVE_SCRIPT_URL, {
            method: "POST",
            redirect: "follow",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              action: "chunk_upload",
              subject: subName,
              totalQuestions: totalQuestions,
              chunkIndex: i,
              totalChunks: totalChunks,
              chunkData: chunkData
            })
          });

          targetPercent = Math.round(((i + 1) / totalChunks) * 100);
        }

        clearInterval(progressTicker);
        targetPercent = 100;
        while (displayPercent < 100) {
          displayPercent += 2;
          if (displayPercent > 100) displayPercent = 100;
          if (upNum) upNum.textContent = displayPercent + '%';
          if (upFill) upFill.style.width = displayPercent + '%';
          await new Promise(r => setTimeout(r, 20));
        }
        isDone = true;

        window.removeEventListener('beforeunload', preventNav);

        if (upBoxIcon) {
          upBoxIcon.style.background = 'rgba(16,185,129,0.1)';
          upBoxIcon.style.color = '#10b981';
          upBoxIcon.innerHTML = '<i data-lucide="check-circle-2" style="width:28px;height:28px"></i>';
          if (window.lucide) lucide.createIcons();
        }
        if (upTextInfo) upTextInfo.textContent = 'สำรองข้อมูลเรียบร้อยแล้ว!';
        if (upSubInfo) upSubInfo.textContent = 'ข้อมูลของคุณถูกบันทึกขึ้น Google Drive ครบ 100%';

        if (btnFinishUpload) {
          btnFinishUpload.style.display = 'block';
          btnFinishUpload.onclick = () => {
            playTone('tap');
            overlay.remove();
            document.body.style.pointerEvents = '';
            document.body.style.userSelect = '';
            openCloudHubModal();
          };
        }

      } catch (err) {
        clearInterval(progressTicker);
        window.removeEventListener('beforeunload', preventNav);
        document.body.style.pointerEvents = '';
        document.body.style.userSelect = '';
        overlay.remove();
        toast('การอัปโหลดขัดข้อง กรุณาลองใหม่อีกครั้ง', 'err');
      }
    }
  });
};
</script>
<script id="neo-fx">
/* NEO FX — เอฟเฟกต์ตกแต่งล้วนๆ ไม่ยุ่งกับข้อมูล/ตรรกะของแอป */
(()=>{
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LIT='.card,.week-card,.mastery-card,.resume-card,.setcard,.quick,.qrow,.mastery-item-v2,.course-card';
  const RIPPLE='.btn,.ib,.nav,.bn,.chip,.quick,.opt,.pal,.srs-btn,.picker-item,.fab';

  // spotlight ตามนิ้ว/เมาส์
  let lit=null;
  document.addEventListener('pointermove',e=>{
    const el=e.target.closest&&e.target.closest(LIT);
    if(lit&&lit!==el)lit.classList.remove('neo-lit');
    lit=el;
    if(!el)return;
    const r=el.getBoundingClientRect();
    el.style.setProperty('--mx',(e.clientX-r.left)+'px');
    el.style.setProperty('--my',(e.clientY-r.top)+'px');
    el.classList.add('neo-lit');
  },{passive:true});
  document.addEventListener('pointerleave',()=>{if(lit)lit.classList.remove('neo-lit');lit=null;});

  // ripple ตอนกด
  document.addEventListener('pointerdown',e=>{
    if(reduce)return;
    const el=e.target.closest&&e.target.closest(RIPPLE);
    if(!el||el.disabled)return;
    const r=el.getBoundingClientRect(), s=Math.max(r.width,r.height)*2.2;
    const cs=getComputedStyle(el);
    if(cs.position==='static')el.style.position='relative';
    const w=document.createElement('span');
    w.className='neo-rip-wrap';
    const d=document.createElement('span');
    d.className='neo-ripple';
    d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
    w.appendChild(d);el.appendChild(w);
    setTimeout(()=>w.remove(),650);
  },{passive:true});

  // แอนิเมชันตอนเปลี่ยนหน้า (เฉพาะตอนกดเมนู ไม่เล่นซ้ำทุกครั้งที่หน้า re-render)
  let enterT;
  const enter=()=>{
    if(reduce)return;
    document.body.classList.remove('neo-enter');void document.body.offsetWidth;
    document.body.classList.add('neo-enter');
    clearTimeout(enterT);enterT=setTimeout(()=>document.body.classList.remove('neo-enter'),900);
  };
  document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-go]'))enter();},true);
  window.addEventListener('load',enter);

  // ตัวเลขวิ่งขึ้นบนการ์ดสถิติ
  const countUp=el=>{
    if(el.dataset.neoCounted)return;
    const m=el.textContent.trim().match(/^(\d[\d,]*)(%?)$/);
    if(!m)return;
    el.dataset.neoCounted='1';
    const end=parseInt(m[1].replace(/,/g,''),10), suf=m[2];
    if(!end||reduce)return;
    const t0=performance.now(), dur=900;
    const tick=t=>{
      const p=Math.min(1,(t-t0)/dur), v=Math.round(end*(1-Math.pow(1-p,3)));
      el.textContent=v.toLocaleString()+suf;
      if(p<1)requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  const view=document.getElementById('view');
  if(view)new MutationObserver(()=>{
    if(!document.body.classList.contains('neo-enter'))return;
    view.querySelectorAll('.stat b,#ringTxt,.mini b,.sring .txt b,.neo-mini-grid b').forEach(countUp);
  }).observe(view,{childList:true});

  // แป้นพิมพ์บังช่องกรอก: ติดตามพื้นที่ที่มองเห็นจริง แล้วเลื่อนช่องที่กดมาไว้กลางจอ
  const vv=window.visualViewport, rs=document.documentElement.style;
  const fit=()=>{if(!vv)return;rs.setProperty('--neo-vvh',vv.height+'px');rs.setProperty('--neo-vvt',vv.offsetTop+'px');};
  if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);fit();}
  const show=f=>f&&f.isConnected&&f.scrollIntoView({block:'center',behavior:'smooth'});
  document.addEventListener('focusin',e=>{
    const f=e.target;
    if(!f.matches||!f.matches('input:not([type=range]):not([type=file]),textarea,select,[contenteditable="true"]'))return;
    setTimeout(()=>show(f),350);setTimeout(()=>show(f),800);
  });
  if(vv)vv.addEventListener('resize',()=>{const f=document.activeElement;if(f&&f.matches&&f.matches('input,textarea,[contenteditable="true"]'))show(f);});

  // ปฏิทินย้อนหลัง (อ่านจาก S.stats.days อย่างเดียว ไม่แก้ข้อมูล)
  const TH_M=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const TH_MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const TH_D=['จ','อ','พ','พฤ','ศ','ส','อา'];
  const TH_DL=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  const dayData=k=>S.stats.days[k]||{answered:0,correct:0,minutes:0,todayCat:{}};
  const kDate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
  const shortT=m=>m>=60?`${Math.floor(m/60)} ชม.`:`${m} น.`;
  const heat=n=>n<=0?0:n<10?1:n<30?2:n<60?3:4;
  const monthSum=(y,m)=>{
    const pre=`${y}-${String(m+1).padStart(2,'0')}-`;let a=0,c=0,min=0,d=0;
    for(const k in S.stats.days){if(!k.startsWith(pre))continue;const x=S.stats.days[k];a+=x.answered||0;c+=x.correct||0;min+=x.minutes||0;if(x.answered>0)d++;}
    return {a,c,min,d};
  };
  const weekExtra=()=>{
    const n=new Date(),s=monthSum(n.getFullYear(),n.getMonth());
    const start=new Date(n);start.setDate(n.getDate()-((n.getDay()+6)%7)-28);
    let sq='';
    for(let i=0;i<35;i++){const d=new Date(start);d.setDate(start.getDate()+i);sq+=`<i class="h${d>n?'x':heat(dayData(dkey(d)).answered)}"></i>`;}
    return `<div class="neo-week-sum">
      <div><small>เดือน${TH_M[n.getMonth()]}</small><b>${s.a.toLocaleString()} ข้อ</b><span>${s.d} วัน · ${hmin(s.min)}</span></div>
      <div class="neo-week-heat">${sq}</div>
    </div>
    <button class="btn block neo-cal-btn"><i data-lucide="calendar-days"></i>เปิดปฏิทินย้อนหลัง</button>`;
  };
  const cal={y:0,m:0,sel:'',mode:'month'};
  let calSwiped=false;
  const calEl=()=>{
    let el=document.getElementById('neoCal');
    if(el)return el;
    el=document.createElement('div');el.id='neoCal';el.className='neo-cal';
    el.innerHTML='<div class="neo-cal-sheet"></div>';
    document.body.appendChild(el);
    el.addEventListener('click',e=>{
      if(calSwiped){calSwiped=false;return;}
      if(e.target===el)return closeCal();
      const b=e.target.closest('[data-cal]');if(!b)return;
      const a=b.dataset.cal;
      if(typeof playTone==='function')playTone('tap');
      if(a==='close')closeCal();
      else if(a==='prev'||a==='next')shiftCal(a==='next'?1:-1);
      else if(a==='mode'){cal.mode=cal.mode==='month'?'year':'month';renderCal();}
      else if(a==='today')openNeoCal();
      else if(a.startsWith('m:')){cal.m=+a.slice(2);cal.mode='month';renderCal();}
      else if(a.startsWith('d:')){cal.sel=a.slice(2);renderCal();}
      else if(a==='more')openDayBreakdownModal({k:cal.sel,lb:TH_D[(kDate(cal.sel).getDay()+6)%7]});
    });
    let sx=0;
    el.addEventListener('pointerdown',e=>{sx=e.clientX;});
    el.addEventListener('pointerup',e=>{
      const dx=e.clientX-sx;
      if(Math.abs(dx)>60&&e.target.closest('.neo-cal-grid,.neo-cal-years')){calSwiped=true;shiftCal(dx<0?1:-1);}
    });
    return el;
  };
  const shiftCal=n=>{
    if(cal.mode==='year')cal.y+=n;
    else{cal.m+=n;if(cal.m<0){cal.m=11;cal.y--;}if(cal.m>11){cal.m=0;cal.y++;}}
    renderCal();
  };
  const dayDetail=k=>{
    if(!k)return '<div class="neo-cal-day empty">แตะวันที่เพื่อดูรายละเอียด</div>';
    const x=dayData(k),dt=kDate(k),n=x.answered||0,ok=x.correct||0;
    const cats=Object.entries(x.todayCat||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    return `<div class="neo-cal-day">
      <div class="neo-cal-day-h"><div><b>วัน${TH_DL[dt.getDay()]}ที่ ${dt.getDate()} ${TH_M[dt.getMonth()]} ${dt.getFullYear()+543}</b><small>${n?'สรุปผลวันนี้':'วันนี้ยังไม่ได้ทำข้อสอบ'}</small></div><span class="neo-pill">${n.toLocaleString()} ข้อ</span></div>
      ${n?`<div class="neo-cal-day-stats">
        <div><b>${ok.toLocaleString()}</b><span>ตอบถูก</span></div>
        <div><b>${Math.round(ok/n*100)}%</b><span>ความแม่น</span></div>
        <div><b>${hmin(x.minutes||0)}</b><span>เวลา</span></div>
      </div>
      ${cats.length?`<div class="neo-cal-cats">${cats.map(([cn,v])=>`<span class="tag b">${esc(cn)} · ${v}</span>`).join('')}</div>`:''}
      <button class="btn block" data-cal="more"><i data-lucide="list"></i>ดูแยกรายวิชา</button>`:''}
    </div>`;
  };
  const renderCal=()=>{
    const sh=calEl().querySelector('.neo-cal-sheet'), now=new Date(), todayK=dkey(now);
    let body;
    if(cal.mode==='month'){
      const s=monthSum(cal.y,cal.m), lead=(new Date(cal.y,cal.m,1).getDay()+6)%7, nd=new Date(cal.y,cal.m+1,0).getDate();
      let cells='<span></span>'.repeat(lead);
      for(let d=1;d<=nd;d++){
        const k=dkey(new Date(cal.y,cal.m,d)),n=dayData(k).answered||0;
        cells+=`<button class="neo-cd h${heat(n)}${k===todayK?' today':''}${k===cal.sel?' sel':''}" data-cal="d:${k}"><b>${d}</b>${n?`<small>${n}</small>`:''}</button>`;
      }
      const inMonth=cal.sel.startsWith(`${cal.y}-${String(cal.m+1).padStart(2,'0')}-`);
      body=`<div class="neo-cal-sum">
        <div><b>${s.a.toLocaleString()}</b><span>ข้อที่ทำ</span></div>
        <div><b>${s.a?Math.round(s.c/s.a*100):0}%</b><span>ความแม่น</span></div>
        <div><b>${s.d}</b><span>วันที่ทำ</span></div>
        <div><b>${shortT(s.min)}</b><span>เวลา</span></div>
      </div>
      <div class="neo-cal-grid">${TH_D.map(x=>`<i>${x}</i>`).join('')}${cells}</div>
      <div class="neo-cal-legend">น้อย<span class="h1"></span><span class="h2"></span><span class="h3"></span><span class="h4"></span>มาก</div>
      ${dayDetail(inMonth?cal.sel:'')}`;
    }else{
      const ms=TH_M.map((_,m)=>monthSum(cal.y,m)), max=Math.max(1,...ms.map(s=>s.a));
      const t=ms.reduce((o,s)=>({a:o.a+s.a,c:o.c+s.c,d:o.d+s.d,min:o.min+s.min}),{a:0,c:0,d:0,min:0});
      body=`<div class="neo-cal-sum">
        <div><b>${t.a.toLocaleString()}</b><span>ทั้งปี</span></div>
        <div><b>${t.a?Math.round(t.c/t.a*100):0}%</b><span>ความแม่น</span></div>
        <div><b>${t.d}</b><span>วันที่ทำ</span></div>
        <div><b>${shortT(t.min)}</b><span>เวลา</span></div>
      </div>
      <div class="neo-cal-years">${ms.map((s,m)=>`<button class="neo-cm${cal.y===now.getFullYear()&&m===now.getMonth()?' today':''}" data-cal="m:${m}">
        <b>${TH_MS[m]}</b><small>${s.a.toLocaleString()} ข้อ · ${s.d} วัน</small>
        <span class="neo-cm-bar"><i style="width:${Math.round(s.a/max*100)}%"></i></span></button>`).join('')}</div>`;
    }
    sh.innerHTML=`<div class="neo-cal-grab"></div>
      <div class="neo-cal-top">
        <button class="ib" data-cal="close"><i data-lucide="x"></i></button>
        <button class="neo-cal-title" data-cal="mode">${cal.mode==='month'?TH_M[cal.m]+' ':''}${cal.y+543}<i data-lucide="chevron-down"></i></button>
        <button class="ib" data-cal="prev"><i data-lucide="chevron-left"></i></button>
        <button class="ib" data-cal="next"><i data-lucide="chevron-right"></i></button>
      </div>${body}
      <button class="btn ghost block" data-cal="today" style="margin-top:14px"><i data-lucide="calendar-check"></i>กลับมาวันนี้</button>`;
    if(typeof icons==='function')icons();
  };
  const openNeoCal=()=>{
    const n=new Date();Object.assign(cal,{y:n.getFullYear(),m:n.getMonth(),sel:dkey(n),mode:'month'});
    renderCal();requestAnimationFrame(()=>calEl().classList.add('on'));
  };
  const closeCal=()=>calEl().classList.remove('on');

  // กองการ์ดหน้าแรก: ปัดซ้าย/ขวาเพื่อสลับการ์ด
  const initDeck=()=>{
    const deck=document.querySelector('.neo-deck');
    if(!deck||deck.dataset.ready)return;
    deck.dataset.ready='1';
    // ย้ายทุกส่วนที่อยู่ใต้กองการ์ด เข้ามาเป็นการ์ดในกอง (ย้าย node เดิม ปุ่มยังทำงานเหมือนเดิม)
    const dotsEl=document.querySelector('.neo-deck-dots');
    const wk=view.querySelector('.week-card');
    for(let el=dotsEl.nextElementSibling;el;){const nx=el.nextElementSibling;el.remove();el=nx;}
    if(wk){
      const w=document.createElement('div');w.className='neo-dcard neo-extra neo-week';
      w.appendChild(wk);w.insertAdjacentHTML('beforeend',weekExtra());deck.appendChild(w);
      w.addEventListener('click',e=>{if(!e.target.closest('[data-dayclick]'))openNeoCal();});
      if(typeof icons==='function')icons();
    }
    const cards=[...deck.children];
    dotsEl.innerHTML=cards.map(()=>'<i></i>').join('');
    const dots=[...dotsEl.children];
    // ขยายกองการ์ดให้พอดีพื้นที่ที่เหลือบนจอ (ไม่ต้องเลื่อนหน้า)
    const fit=()=>{
      if(!deck.isConnected)return window.removeEventListener('resize',fit);
      const nav=document.querySelector('.bottomnav');
      const navH=nav&&getComputedStyle(nav).display!=='none'?nav.offsetHeight+16:0;
      deck.style.height=Math.max(340,innerHeight-deck.getBoundingClientRect().top-navH-40)+'px';
    };
    fit();setTimeout(fit,700);window.addEventListener('resize',fit);
    let order=cards.map((_,i)=>i), sx=0, sy=0, dx=0, drag=false, lock=null, swiped=false;
    const paint=()=>{
      order.forEach((ci,pos)=>{cards[ci].dataset.pos=pos;cards[ci].style.transform='';});
      dots.forEach((d,i)=>d.classList.toggle('on',i===order[0]));
    };
    const next=dir=>{
      const top=cards[order[0]];
      if(typeof playTone==='function')playTone('tap');
      top.style.transition='transform .3s ease-in,opacity .3s';
      top.style.transform=`translateX(${dir*120}%) rotate(${dir*14}deg)`;
      top.style.opacity='0';
      setTimeout(()=>{
        top.style.transition='none';order.push(order.shift());paint();
        top.style.opacity='';void top.offsetWidth;top.style.transition='';
      },280);
    };
    const prev=()=>{
      if(typeof playTone==='function')playTone('tap');
      order.unshift(order.pop());
      const top=cards[order[0]];
      top.style.transition='none';top.style.transform='translateX(-120%) rotate(-14deg)';top.style.opacity='0';
      void top.offsetWidth;
      top.style.transition='';top.style.opacity='';
      paint();
    };
    dots.forEach((d,i)=>d.onclick=()=>{while(order[0]!==i)order.push(order.shift());paint();});
    deck.addEventListener('pointerdown',e=>{
      if(!e.target.closest('[data-pos="0"]'))return;
      sx=e.clientX;sy=e.clientY;dx=0;drag=true;lock=null;
    });
    deck.addEventListener('pointermove',e=>{
      if(!drag)return;
      dx=e.clientX-sx;
      const dy=e.clientY-sy;
      if(lock===null&&Math.abs(dx)+Math.abs(dy)>8){
        lock=Math.abs(dx)>Math.abs(dy)?'x':'y';
        if(lock==='x')deck.setPointerCapture(e.pointerId);
      }
      if(lock!=='x')return;
      const top=cards[order[0]];
      top.style.transition='none';
      top.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;
    });
    const end=()=>{
      if(!drag)return;
      drag=false;
      const top=cards[order[0]];
      if(lock==='x'&&Math.abs(dx)>70){swiped=true;dx<0?next(-1):prev();}
      else{top.style.transition='';top.style.transform='';}
    };
    deck.addEventListener('pointerup',end);
    deck.addEventListener('pointercancel',end);
    // ปัดแล้วไม่ให้นับเป็นการกดปุ่มในการ์ด
    deck.addEventListener('click',e=>{if(swiped){swiped=false;e.stopPropagation();e.preventDefault();}},true);
    paint();
  };
  if(view)new MutationObserver(()=>{document.body.classList.toggle('neo-home',!!view.querySelector('.neo-deck'));initDeck();}).observe(view,{childList:true});
  initDeck();

  // เอียง 3D การ์ด hero ตามเมาส์ (เฉพาะจอที่มีเมาส์)
  if(matchMedia('(hover:hover)').matches&&!reduce){
    document.addEventListener('pointermove',e=>{
      const h=e.target.closest&&e.target.closest('.hero:not(.neo-dcard)');
      if(!h)return;
      const r=h.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
      h.style.transform=`perspective(1000px) rotateX(${(-y*4).toFixed(2)}deg) rotateY(${(x*5).toFixed(2)}deg)`;
      h.style.transition='transform .1s';
      h.onpointerleave=()=>{h.style.transition='transform .6s cubic-bezier(.2,.9,.2,1)';h.style.transform='';};
    },{passive:true});
  }
})();
</script>
</body>
</html>
